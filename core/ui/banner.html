<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;">
  <title>Claw Control UI notices</title>
  <!-- ui.css for the page's own reset and the shared helpers the stack uses;
       banner.css for the banner itself, so the card's styling lives in one file
       that names tokens and no colours. -->
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="banner.css">
</head>
<body class="banner-body">
  <!-- Conditions that stay true until something fixes them, over the top of
       whatever the window is showing. Not a dialog: none of these is a question,
       and a dialog would be dismissed while the condition carried on being true
       with nothing on screen to say so.

       This page lives in a view sized to exactly the height it reports, because
       a view swallows every mouse event inside its bounds no matter what is
       drawn there: an over-tall banner would be an invisible strip eating clicks
       on the UI underneath. ★ So the two things must be the same rectangle, and
       the bar paints ALL of it: see the rule at the top of banner.css. See also
       refreshBanner in src/main.js, which loads this page BEFORE putting the
       view on the window, because a view loaded while it is attached takes the
       reader's keyboard and nothing here asks it to.

       Its one job to the host is that height, reported on every render, and the
       bar's footer row is part of it. -->
  <div class="banner-stack" id="stack"></div>
  <script src="surface.js"></script>
  <script src="banner.js"></script>
</body>
</html>
