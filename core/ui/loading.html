<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: file:;">
  <title>Connecting…</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="loading-body">
  <!-- What the window shows while it has no gateway page to show: during a
       connect, and afterwards if that connect failed.

       It is a cover in its own view rather than a page loaded into the gateway
       view, and the reason is what a failure does to that view. Chromium
       commits its own error document there, and loading over the top of it
       would be a second navigation racing the first. Here the gateway page
       loads, or fails, underneath and untouched, and when it succeeds this
       whole view goes away with nothing to unwind.

       The failure text is not here. It slides down from the top as a notice,
       with the link to Settings, because a failure is a condition rather than a
       place: it should not take the screen away from someone who did not ask to
       leave it. See failureNotice() in src/connection.js.

       NO GRAB BAND. Every page of ours used to carry one across its own top 50px,
       and on this page that band was the thing that made the notice banner's own
       controls unclickable: the cover's view begins at window y 36, below the
       title strip, so the band landed on window y 36..86 while the banner's ✕ and
       Open Settings sit at 58..86. This page does not need one, because the strip
       above it is still on screen while the cover is up, and that strip is the
       window's drag surface. See the dragbar section in ui.css, and
       desktop/test/drag-regions.test.js, which fails if a page below the strip
       carries a band again. -->
  <main class="loading" id="root">
    <div class="loading__mark">
      <span class="chela-mark loading__logo" aria-hidden="true"><span class="chela-mark__neon"></span></span>
      <span class="loading__ring" aria-hidden="true"></span>
    </div>
    <h1 class="loading__title" id="title">Connecting…</h1>
    <p class="loading__label" id="label"></p>
    <p class="loading__url mono" id="url"></p>

    <!-- The bar reports milestones a load actually reached, eased over time so
         it does not sit still through the long ones. src/progress.js owns the
         curve and says what the number is allowed to claim. -->
    <div class="loading__progress" role="progressbar" id="bar"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-labelledby="title">
      <span class="loading__progress-fill" id="fill"></span>
    </div>
    <p class="loading__meter">
      <span class="loading__percent mono" id="percent">0%</span>
      <!-- aria-hidden: the quips are decoration, and a screen reader announcing
           a new joke every three seconds over a live progress bar is noise on
           top of the one thing here worth hearing. -->
      <span class="loading__quip" id="quip" aria-hidden="true"></span>
    </p>

    <button class="ghost loading__retry" id="retry" type="button" hidden>Try again</button>
  </main>
  <script src="surface.js"></script>
  <script src="loading.js"></script>
</body>
</html>
