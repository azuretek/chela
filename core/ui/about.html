<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- The layout width, and it is here for the same two reasons it is in
       settings.html, the page this one is presented beside.

       Without it a web view falls back to the 980px desktop layout viewport and
       scales the whole document down to fit its frame. On a 402pt-wide phone that
       is a factor of about 0.41, so About rendered as a narrow card of ~5px text
       in the middle of the screen instead of filling it, which is what was still
       being reported after the sheet itself had already been pinned full height.
       Measured on an iPhone simulator on 2026-09-16, in both presentations, with
       the settings page beside it for the control: settings carried this line and
       filled the screen, About did not and did not. The desktop is unaffected
       either way, because Chromium ignores this meta outside mobile viewport
       mode.

       `viewport-fit=cover` is the other half. The phone lays this page out edge
       to edge (see mobile/Claw/AboutView.swift, which turns the web view's own
       inset adjustment off), so the page has to inset its own content, and
       `env(safe-area-inset-*)` only resolves to a non-zero value under it. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: file:;">
  <title>About Claw Control UI</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <!-- Ours rather than Electron's `role: 'about'` panel. That panel shows a
       fixed name/version/copyright card: it cannot show the commit a build came
       from, cannot say anything about updating, and cannot carry a button, so
       the two things people open About to do are the two things it cannot do.
       It is also a different dialog on each platform, and on Windows it only
       exists at all from Electron 15. See the overlay section in main.js. -->
  <div class="scrim" id="scrim">
    <div class="dragbar"></div>
    <div class="modal modal--narrow" role="dialog" aria-modal="true" aria-labelledby="title">
      <header class="modal__header">
        <img class="modal__icon" src="assets/claw.svg" alt="">
        <div class="stack">
          <h1 id="title">Claw Control UI</h1>
          <p class="sub" id="build">Loading…</p>
        </div>
        <button class="modal__close" id="close" type="button" aria-label="Close" title="Close (Esc)">&#10005;</button>
      </header>
      <div class="modal__body">

        <div class="card">
          <div class="stack">
            <span class="name">Updates</span>
            <span class="muted-sm" id="update-status">Loading…</span>
            <span class="muted-sm" id="update-hint" hidden></span>
          </div>
          <div class="actions">
            <button id="check" class="primary">Check for updates</button>
            <button id="releases" class="ghost">Release notes</button>
          </div>
          <div class="result" id="check-result"></div>
        </div>

        <!-- Filled in by about.js: one row per thing a bug report asks for. -->
        <div id="facts"></div>

      </div>
    </div>
  </div>

  <script src="about.js"></script>
</body>
</html>
