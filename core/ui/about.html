<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- The layout width, and it is here for the same two reasons it is in
       settings.html, the page this one is presented beside.

       Without it a web view falls back to the 980px desktop layout viewport and
       scales the whole document down to fit its frame. On a 402pt-wide phone that
       is a factor of about 0.41, so About rendered as a narrow card of ~5px text
       in the middle of the screen instead of filling it, which is what was still
       being reported after the sheet itself had already been pinned full height.
       Measured on an iPhone simulator on 2026-09-16, in both presentations, with
       the settings page beside it for the control: settings carried this line and
       filled the screen, About did not and did not. The desktop is unaffected
       either way, because Chromium ignores this meta outside mobile viewport
       mode.

       `viewport-fit=cover` is the other half. The phone lays this page out edge
       to edge (see mobile/Claw/AboutView.swift, which turns the web view's own
       inset adjustment off), so the page has to inset its own content, and
       `env(safe-area-inset-*)` only resolves to a non-zero value under it. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: file:;">
  <title>About Claw Control UI</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <!-- Ours rather than Electron's `role: 'about'` panel. That panel shows a
       fixed name/version/copyright card: it cannot show the commit a build came
       from, cannot say anything about updating, and cannot carry a button, so
       the two things people open About to do are the two things it cannot do.
       It is also a different dialog on each platform, and on Windows it only
       exists at all from Electron 15. See the overlay section in main.js. -->
  <div class="scrim" id="scrim">
    <div class="dragbar"></div>
    <div class="modal modal--narrow" role="dialog" aria-modal="true" aria-labelledby="title">
      <header class="modal__header settings-sidebar__header">
        <!-- The way back, and it is the Control UI's own back control: the same
             `settings-sidebar__back` with the same icon box and the same esc chip
             that settings.html carries, because a person arriving here from
             Settings should find the way out where the rest of the app puts it.

             This page had only a dismissal cross at the trailing edge, which says
             "close this" and nothing about where you land, and did not say that
             Escape does the same thing. Both halves are upstream's control rather
             than our own button, so the two pages cannot drift into two
             different ways back.

             The label names its own destination rather than repeating
             upstream's "Back to app": About is presented over Settings, so this
             returns to Settings, and the shared label would be a lie here. The
             control, the glyph and the keyboard affordance are the shared part.
             The id stays `close`, which is what about.js wires and what the
             tests name. -->
        <button class="settings-sidebar__back" id="close" type="button">
          <span class="settings-sidebar__back-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m12 19-7-7 7-7" /><path d="M19 12H5" /></svg></span>
          Back to settings
          <kbd class="settings-sidebar__esc" aria-hidden="true">esc</kbd>
        </button>
        <div class="modal__headline">
          <img class="modal__icon" src="assets/claw.svg" alt="">
          <div class="settings-row__text">
            <h1 class="settings-sidebar__title" id="title">Claw Control UI</h1>
            <p class="sub" id="build">Loading…</p>
          </div>
        </div>
      </header>
      <div class="modal__body">

        <!-- One group with two rows, which is upstream's shape for a section: the
             text rows carry the state, and the row that holds nothing but buttons
             is an actions row. Ours was one card with a stack of three spans and
             a button row, which is the same content in none of the interface's
             components. -->
        <div class="settings-group">
          <div class="settings-row settings-row--stacked">
            <div class="settings-row__text">
              <span class="settings-row__title">Updates</span>
              <span class="settings-row__desc" id="update-status">Loading…</span>
              <span class="settings-row__desc" id="update-hint" hidden></span>
            </div>
          </div>
          <div class="settings-row settings-row--actions">
            <div class="settings-row__control">
              <button id="check" class="primary">Check for updates</button>
              <button id="releases" class="ghost">Release notes</button>
            </div>
            <div class="result" id="check-result"></div>
          </div>
        </div>

        <!-- Filled in by about.js: one row per thing a bug report asks for. -->
        <div id="facts"></div>

      </div>
    </div>
  </div>

  <script src="about.js"></script>
</body>
</html>
