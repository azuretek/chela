appId: com.azuretek.claw-desktop
productName: Claw Control UI
copyright: Copyright © 2026 Abi Renhart

directories:
  output: dist
  buildResources: build

# Writes src/build-info.json, the commit being packaged, before the app is
# assembled, so every build carries its own identity and Settings can show it.
# One hook covers `pack`, all three `build:*` scripts, and CI.
beforePack: scripts/build-info.js

files:
  - src/**/*
  - package.json
  - "!**/*.map"
  # The shared core is a workspace dependency, "claw-core": "workspace:*" in
  # package.json, which pnpm resolves as node_modules/claw-core -> ../../core (a
  # symlink into the sibling package). Sourcing it from node_modules rather than
  # reaching up and out to ../core is the de-vendor: desktop consumes core the way
  # it consumes any dependency, through resolution, not by the packer copying a
  # sibling tree it happens to know the path of. electron-builder dereferences the
  # symlink, so the same files are packaged.
  #
  # It still ships to core/ (not node_modules/claw-core/) because desktop's src/*.js
  # imports it by RELATIVE path (`../../core/<mod>.js`), not by the bare specifier,
  # and the packed layout must satisfy that. In the packed app the target depends on
  # which side of the archive boundary the runtime resolves against, and the two do
  # not agree: the shipped build's own ERR_MODULE_NOT_FOUND looked in
  # `Contents/Resources/core`, while Electron's ESM resolver, asked from
  # `app.asar/src/`, clamps the climb at the archive root and lands on
  # `app.asar/core`. Because they disagree, core ships in BOTH places. It is ~50 KB
  # of plain JS, and a boot that works is worth far more than the duplicate.
  # `npm run smoke:packed` and scripts/check-package.js are what keep this honest.
  - from: node_modules/claw-core
    to: core
    filter:
      - "**/*.js"
      - "**/*.json"
      # The shared web surface, which is not only JavaScript: core/ui holds the
      # pages our own chrome is drawn from, one of which (settings.html) the iOS
      # app renders as well, plus the stylesheet they all load and the artwork two
      # of them draw. Without these the packaged app opens a page whose stylesheet
      # and logo are missing: it renders unstyled and reports no error anywhere.
      # desktop/scripts/check-package.js requires them to be present.
      - "**/*.html"
      - "**/*.css"
      - "**/*.svg"
      - "!test/**"
      - "!node_modules/**"

# The same core, from the same workspace-resolved node_modules/claw-core, at the
# path an unpacked app resolves `../../core` to. The same filters, for the same
# reason: one tree, and it has to arrive complete.
extraResources:
  - from: node_modules/claw-core
    to: core
    filter:
      - "**/*.js"
      - "**/*.json"
      - "**/*.html"
      - "**/*.css"
      - "**/*.svg"
      - "!test/**"
      - "!node_modules/**"

# Declared so electron-builder emits update metadata during the build:
# `latest.yml`, `latest-mac.yml` and the `.blockmap` files. Those are what
# describes a release to an updater; without them a GitHub Release is a folder
# of installers that nothing can read as "a version".
#
# It does NOT publish from here. Every build runs `--publish never` and CI
# attaches the files to the release itself, so there is exactly one publisher
# and no GH_TOKEN in the platform build jobs.
publish:
  provider: github
  owner: azuretek
  repo: claw-control-ui

# Signing is credential-driven, not configured here.
#
# There is deliberately no `identity: null`. That key *forces* an unsigned build
# and would have to be deleted the day a certificate exists, a code change to
# turn on something that should be a credential change. Instead the standard
# electron-builder behaviour applies: sign if an identity is discoverable, warn
# and continue unsigned if not.
#
#   unsigned          no Developer ID in the keychain -> "skipped macOS code
#                     signing". This is CI today, which additionally sets
#                     CSC_IDENTITY_AUTO_DISCOVERY false so a runner can never
#                     pick up a stray identity, and any checkout that is not the
#                     signing machine.
#   signed            a "Developer ID Application" certificate in the keychain,
#                     or CSC_LINK + CSC_KEY_PASSWORD in CI.
#
# `notarize` stays false here for the same reason there is no `identity`. It is
# an upload to Apple that fails outright without credentials, so hard-enabling it
# would break every build that has none. scripts/build.js passes
# `--config.mac.notarize=true` for a single run when APPLE_API_KEY,
# APPLE_API_KEY_ID and APPLE_API_ISSUER are all set, an App Store Connect *Team*
# key, since Apple's own docs say individual keys cannot use notarytool.
#
# While a build is unsigned, macOS quarantines the downloaded .dmg, see README
# for the fix, and src/updates.js for why macOS cannot auto-update without this.
mac:
  category: public.app-category.productivity
  icon: build/icon.png
  notarize: false
  artifactName: claw-desktop-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]

# electron-builder notarizes and staples the .app, then builds the DMG around
# it, so the DMG itself is never submitted and Gatekeeper rejects the container
# even though the app inside is accepted. scripts/build.js notarizes and staples
# each DMG afterwards to close that gap.
#
# `sign` has to be true for that to mean anything, and it must happen HERE
# rather than in scripts/build.js. A notarization ticket is stapled to a code
# signature, so stapling an unsigned DMG silently does nothing: `stapler
# validate` still passes, because it falls back to fetching the ticket from
# Apple over the network, while Gatekeeper reports "no usable signature" on the
# file a user downloaded. The chain is sign, notarize, staple, in that order.
#
# Doing it after the build instead would mean reimplementing identity discovery
# and the keychain lookup that electron-builder already does here, to sign a file
# it just produced. (It used to be flatly impossible: with CSC_LINK,
# electron-builder built a temporary keychain and destroyed it on finish, so no
# identity survived the build. CI now owns the keychain, see the release
# workflow, so the certificate outlives the build; the duplication is the reason
# that stands.)
#
# electron-builder's own note calls DMG signing unnecessary and warns it causes
# errors "in combination with notarization requirements". That holds for signing
# a DMG nobody notarizes; here the DMG is notarized straight afterwards.
#
# Stapling rewrites the file, which would invalidate any checksum already
# recorded for it. latest-mac.yml lists a sha512 and size per artifact, so the
# DMGs are kept out of it: macOS auto-update reads the zip (electron-updater's
# MacUpdater hands that to Squirrel.Mac), and the DMG is only ever a human
# download. Nothing that updates reads a DMG checksum, so nothing goes stale.
dmg:
  sign: true
  writeUpdateInfo: false

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64, arm64]
  # Default is "${productName} Setup ${version}.exe". Spaces make the file painful
  # to script against, notably over the Windows node exec, which splits argv
  # without honouring quotes.
  artifactName: claw-desktop-Setup-${version}-${arch}.${ext}

nsis:
  # Without this every release carried THREE installers: one per architecture,
  # plus a 216 MB universal one holding both. `${arch}` in artifactName does not
  # prevent that, which is what the comment here used to claim, read
  # NsisTarget.finishBuild and it is the opposite. With a universal installer
  # wanted (the default), a pattern containing `${arch}` makes electron-builder
  # build the per-arch installers *in addition to* it.
  #
  # Nothing ever downloaded the universal one. electron-updater's findFile picks
  # the file whose name contains process.arch, so it was ~2 GB of dead weight
  # across the ten dev releases we retain, and a third similar filename on the
  # release page for a human to pick wrong.
  #
  # false takes the other branch entirely: NsisTarget.build() emits each
  # architecture's installer as it packages it, and finishBuild only cleans up.
  buildUniversalInstaller: false
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Claw Control UI

# AppImage is the only Linux target, and that is an update decision rather than a
# packaging preference. electron-updater ships four Linux updaters; AppImage is
# the only one that installs without a privilege prompt, because it overwrites
# the single file the app is running from. The .deb and .rpm updaters shell out
# to dpkg or rpm through pkexec, so every background update would raise a
# password dialog, see src/updates.js.
#
# `arch` is explicit for the same reason as win: without it electron-builder
# builds only the host architecture, so an x64 CI runner would quietly publish a
# release with nothing an arm64 machine can run. Both are cross-built here; an
# AppImage is its architecture's runtime prepended to a squashfs image, so the
# host CPU never has to match.
#
# artifactName matches the other two platforms. The default carries a space
# ("Claw Control UI-1.0.0.AppImage"), and the released filename is what people type
# into chmod.
#
# syncDesktopName pairs with `desktopName` in package.json, and matters more for
# this app than for most. Electron sets WM_CLASS from the desktop entry name, and
# that is how a desktop environment links a running window back to its .desktop
# file. Without the pair, GNOME and KDE show Claw Control UI under a generic Electron
# icon in the dock and in alt-tab, for an app that lives in the tray for weeks,
# the icon is most of what anyone sees of it.
linux:
  icon: build/icon.png
  category: Utility
  artifactName: claw-desktop-${version}-${arch}.${ext}
  synopsis: Desktop shell for the OpenClaw Control UI
  syncDesktopName: true
  target:
    - target: AppImage
      arch: [x64, arm64]
