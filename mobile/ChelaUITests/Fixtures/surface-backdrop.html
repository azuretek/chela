<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Surface backdrop fixture</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #808080; }
  /* The band the sheet leaves uncovered, as a hard alternating edge: a blur
     behind the sheet smears it towards grey, and no blur leaves the pixels
     exactly black and white. */
  .edges { height: 44px; background: repeating-linear-gradient(to right, #000 0 4px, #fff 4px 8px); }
  /* A flat field on the same row band, for measuring the dim: a blur is a
     no-op over a flat colour, so what is left is the dim itself. */
  .flat { height: 44px; background: #808080; }
  .below { height: calc(100% - 88px); background: #808080; }
  p { font: 16px -apple-system; color: #fff; margin: 8px; }
</style>
</head>
<body>
  <div class="edges"></div>
  <div class="flat"><p>Fixture ready</p></div>
  <div class="below"></div>
</body>
</html>
