# The Xcode project, described once and generated.
#
# `Chela.xcodeproj` is build output, not source. This file is the single source of
# truth for the project's shape: xcodegen renders the project from it, and the
# rendered copy is gitignored, so there is exactly one owner. A committed
# project file would drift the first time someone changed a setting in the Xcode
# UI, and the drift would not show up in review, because a `pbxproj` diff is
# unreadable in either direction.
#
# Regenerate after anything that changes the project's shape, meaning this file
# or the layout of the sources:
#
#     cd mobile && xcodegen generate

name: Chela

options:
  bundleIdPrefix: com.azuretek
  # The floor follows the CI matrix: the deployment target names the oldest
  # version we actually build and test against, so the support we declare and
  # the support we verify are the same claim rather than two numbers that drift
  # apart. The matrix in .github/workflows/mobile-pipeline.yml currently covers iOS 26
  # and 27, so the floor is 26. Adding an older version to the matrix means
  # moving this line in the same change; leaving it behind would keep claiming
  # support for versions nothing tests.
  #
  # It was 17.0 before the matrix existed, which asserted support for nine
  # majors that no run had ever exercised.
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    # Swift 6 language mode: the concurrency checking is worth having from the
    # first file rather than retrofitting onto a shell that already has four
    # delegate surfaces in it.
    SWIFT_VERSION: "6.0"

targets:
  Chela:
    type: application
    platform: iOS
    sources:
      - path: Chela
      # The client-context spec, bundled rather than mirrored.
      #
      # Nine of the specs this app shares with the desktop are mirrored as Swift
      # constants and proven against the spec by a parity test, which works for a
      # name or a number: two copies of a value can be compared. The specs that
      # are bundled instead are the ones a mirror cannot serve: a
      # program, or the values a client reads for a shape it cannot restate.
      # `core/test/specs.test.js` asserts this list, so a spec cannot arrive
      # unclassified, and it is the inventory to read rather than this comment.
      #
      # For this one the mirror is impossible because the file holds the injected
      # script, and a mirror of a script would be a second copy of it in another
      # language, which is the fork the shared file exists to prevent. So the app
      # carries the one owner and reads it, and `PromptMetadataParityTests`
      # asserts that what it reads is what the desktop reads.
      - path: ../core/spec/prompt-metadata.json
        buildPhase: resources
      # The App-settings affordance, bundled rather than mirrored, for the same
      # reason the client-context spec above is: it holds the ONE injected script
      # that adds the footer control, and a mirror of a script is a second copy
      # of it. AppSettingsAffordance reads this at runtime and installs it through
      # a WKUserScript, and AppSettingsAffordanceParityTests asserts the bundled
      # copy is byte for byte the repository's.
      - path: ../core/spec/app-settings-affordance.json
      - path: ../core/spec/app-frame-inset.json
        buildPhase: resources
      # The native token handoff, bundled rather than mirrored for its shape.
      #
      # NativeControlAuth reads this at runtime for the global name, the client
      # mode and the operator scopes, then sets that global at document start so
      # the Control UI authenticates as the operator who entered the token. The
      # per-client half (the id, the platform, the device family) is Swift
      # constants proven against nothing, because they name THIS client and have
      # no shared owner to disagree with; the shared half is here, and
      # NativeControlAuthParityTests asserts this port reproduces the fixture.
      - path: ../core/spec/native-control-auth.json
        buildPhase: resources
      # What identifies an OpenClaw payload, bundled rather than mirrored.
      #
      # The same reason the affordance spec above is bundled: this client has no
      # Swift copy of the SIGNALS, only a port of the rule that reads them, so
      # "is this an OpenClaw gateway" is one answer rather than one per platform.
      # GatewayIdentity reads this at runtime for the payload markers, the health
      # path, the header names and every sentence the reader sees, and
      # GatewayIdentityParityTests proves this port reaches the same verdict the
      # JavaScript does on the same inputs.
      - path: ../core/spec/gateway-identity.json
        buildPhase: resources
      # The device-pairing contract, bundled rather than mirrored for its ONE
      # injected script: the observer that watches the page's gateway socket and
      # reports a pairing close to the native layer. PairingState reads this at
      # runtime for that script (and for the copy the pairing screen shows),
      # while the parser rules are Swift constants proven against
      # core/fixtures/pairing.json, the same split as NativeControlAuth. A mirror
      # of the script would be a second copy of it, which is the fork the shared
      # file exists to prevent, so PairingParityTests asserts the bundled copy is
      # the repository's.
      - path: ../core/spec/pairing.json
        buildPhase: resources
      # The reconnect-resume shim, bundled rather than mirrored for its ONE
      # injected script, the same shape as the pairing observer above: it wraps
      # the page's WebSocket.send and drops the Control UI's reserved
      # reconnect-resume marker from a chat.send frame, which the gateway
      # refuses from a client it does not count as an operator UI. This client
      # connects with its native descriptor, so the marker is never stripped for
      # it and the send fails as an invalid param. ReconnectResumeShim reads this
      # at runtime and installs the script through a WKUserScript at document
      # start. A shim with a named removal trigger, which the spec's own why list
      # carries: it goes when a released gateway strips the reserved field for
      # every client, and ReconnectResumeShimParityTests asserts the bundled copy
      # is the repository's.
      - path: ../core/spec/reconnect-resume-shim.json
        buildPhase: resources
      # The device-identity persistence contract, bundled rather than mirrored
      # for its TWO injected scripts: the seed that restores the page's device
      # keypair into localStorage before the page boots, and the capture that
      # posts the page's current keypair out to the native layer. DeviceIdentity
      # reads this at runtime for those scripts, while the storage key, the seed
      # global and the message name are Swift constants proven against
      # core/fixtures/device-identity.json, the same split as NativeControlAuth.
      # This is what makes an approved device stay approved across a reinstall:
      # the gateway recognises a paired device by the keypair the page presents,
      # and a WKWebView wipes that keypair's localStorage on uninstall, so the
      # Keychain holds it and these scripts bridge it. A mirror of either script
      # would be a second copy of it, which is the fork the shared file exists to
      # prevent, so DeviceIdentityParityTests asserts the bundled copy is the
      # repository's.
      - path: ../core/spec/device-identity.json
        buildPhase: resources
      # The shared settings surface, bundled rather than mirrored.
      #
      # The same three files the desktop loads out of core/ui, so this client
      # renders the desktop's settings page instead of a native screen per tab.
      # They are copied in flat, which is what makes the page's own relative links
      # (`ui.css`, `settings.js`) resolve in the bundle exactly as they do in the
      # repository, and `SettingsView` loads the page with read access to that
      # directory.
      #
      # The spec travels with them because the page cannot read it at runtime any
      # more than it can here: it is a file:// document with `default-src 'none'`,
      # so the split arrives through the host instead, as it stands. See
      # mobile/Chela/SettingsSpec.swift.
      - path: ../core/ui/settings.html
        buildPhase: resources
      - path: ../core/ui/settings.js
        buildPhase: resources
      - path: ../core/ui/ui.css
        buildPhase: resources
      # The departure handshake the shared pages call, and the reason it travels
      # with them: settings.html and about.html both load it, so a bundle without
      # it would serve a page whose own relative link resolves nowhere. What it
      # does here is small (this client's sheets are dismissed by SwiftUI, which
      # does its own animation) but the page is ONE copy, and a page that loads a
      # script only some clients ship is how one copy becomes two.
      - path: ../core/ui/surface.js
        buildPhase: resources
      - path: ../core/spec/settings.json
        buildPhase: resources
      # Naming and progress, bundled for the same reason and read through the one
      # loader, `BundledSpec`. Nothing about either file needs a Swift copy: the
      # app can carry the one owner, so it does, and the values cannot drift
      # because there is only one of them. `core/test/specs.test.js` is the
      # inventory of which specs are read this way.
      - path: ../core/spec/naming.json
        buildPhase: resources
      - path: ../core/spec/progress.json
        buildPhase: resources
      # Everything else the app needed as a value is bundled here too, one loader
      # for all of them: the feed paths and channel names, the notice tones and
      # their rank, the update intervals, the two sentences a pending row shows,
      # and the release asset names an OTA install URL is built from.
      # `core/test/specs.test.js` is the inventory of which specs are read this
      # way, and `BundledSpecTests` asserts no key a client needs is dropped.
      - path: ../core/spec/feed.json
        buildPhase: resources
      - path: ../core/spec/notices.json
        buildPhase: resources
      - path: ../core/spec/updates.json
        buildPhase: resources
      - path: ../core/spec/connection.json
        buildPhase: resources
      - path: ../core/spec/release.json
        buildPhase: resources
      - path: ../core/spec/tokens.json
        buildPhase: resources
      # The banner's controls, their words and the Control UI icons, read by
      # BannerSpec.swift. The desktop reads the same file through core/banner.js.
      - path: ../core/spec/banner.json
        buildPhase: resources
      - path: ../core/spec/app-icons.json
        buildPhase: resources
      # The shared About page, bundled rather than mirrored, for the same reason
      # the settings page is: it is the desktop's own About page (core/ui), so
      # this client renders it instead of a native screen. About was reachable
      # only from a menu bar before, which this client has none of, so it now
      # hangs off Settings through the shared `openAbout` command, and
      # AboutHost.swift answers the same window.clawDesktop calls the desktop's
      # preload does. Copied in flat so the page's own relative links (ui.css,
      # about.js, assets/claw-mark.css) resolve in the bundle exactly as in the repo;
      # AboutSurface loads the page with read access to that directory.
      - path: ../core/ui/about.html
        buildPhase: resources
      - path: ../core/ui/about.js
        buildPhase: resources
      # The pin that records which Control UI this build was built against, beside
      # the page that names it. Bundled rather than mirrored, for the reason the
      # other specs here are: it is the ONE owner of that revision, and AboutHost
      # reads it at runtime so About names what the class guard keeps true against
      # the checkout. A Swift constant would be a second copy of it, and
      # AboutHostTests asserts this copy is the repository's byte for byte.
      - path: ../core/spec/upstream-reference.json
        buildPhase: resources
      # The masks the About header's mark is painted through, under `assets/`
      # beside the page so ui.css's `@import url(assets/claw-mark.css)` resolves.
      # `type: folder` makes this a folder reference, which copies the directory
      # into the bundle whole and keeps the `assets/` path: a plain group would
      # flatten claw-mark.css to the bundle root and the relative import would break.
      - path: ../core/ui/assets
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azuretek.claw-mobile
        # Blank on purpose: Xcode fills this from the Apple ID that signs in, so
        # a team id committed here would be a second place to keep in step with
        # the account, and a wrong one fails in a way nobody reads.
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        # The app's full identity, which is a different thing from a version a
        # bundle may carry: `X.Y.Z-dev.<count>.<sha>` is what the client knows
        # itself as and what its update check compares against a feed, and it
        # cannot be CFBundleShortVersionString because App Store Connect
        # accepts only three dot separated integers there.
        #
        # A local build reports its marketing version, which is honest about
        # what it is; the release workflow overrides this setting with the
        # version it derived from the commit, so the value has one owner and
        # there is no second copy of it to keep in step.
        CLAW_BUILD_VERSION: "$(MARKETING_VERSION)"
        # The plist is a file in the repo rather than generated, because Phase 3
        # and 4 add entitlement-adjacent keys (Keychain access groups, ATS
        # notes) that are easier to review as a diff than as build settings.
        INFOPLIST_FILE: Chela/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Every theme's icon set ships as an alternate icon, so AppIconOffer can
        # switch to it. actool writes CFBundleAlternateIcons into the built
        # Info.plist from these; nothing is listed by hand.
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # iPhone only. The Control UI is responsive, so an iPad build is
        # possible, but nothing in this project has been designed for a tablet
        # and claiming support would mean supporting it.
        TARGETED_DEVICE_FAMILY: "1"

  ChelaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ChelaTests
    dependencies:
      - target: Chela
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azuretek.claw-mobile.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Chela:
    build:
      targets:
        Chela: all
        # Built for the test action only: the verify step builds the app, and
        # pulling the test bundle in would make that build do work no one asked
        # for.
        ChelaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ChelaTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
