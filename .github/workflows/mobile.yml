name: Claw mobile CI

# The iOS client lives in mobile/ and imports core/, the shared library. Until
# this workflow existed, neither was built on CI: release.yml builds the desktop
# app and deliberately skips `mobile/**`, so the first sign of a broken Swift
# build was somebody building by hand.
#
# This is the compile-and-test half of the mobile pipeline. The publish half is
# deliberately absent rather than forgotten: the distribution channel (ad-hoc
# OTA against TestFlight) is still undecided, and that choice is what decides
# signing, export and upload. Nothing here may grow to need an Apple
# credential, and nothing here signs anything.

# Two ways in, and they mean the same thing here:
#
#   push to main       whatever just landed in mobile/ or core/ is built.
#   pull_request       the same paths, before they land.
#   workflow_dispatch  any ref, on demand.
#
# `paths` names what this workflow depends on rather than what it ignores.
# `core/**` is the non-obvious entry: the client consumes the shared library, so
# a change confined to core/ can break this build while leaving the desktop
# alone, and a filter of `mobile/**` alone would skip exactly that run. No docs
# or config path appears here, because none of them can change what compiles.
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'core/**'
      # A workflow that cannot run on its own change is one nobody can fix.
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'core/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

# Pushing three commits in a minute should build the last one, not all three.
# Tag builds are exempt: a release run must never be cancelled by anything.
# Nothing here is triggered by a tag today, so the guard is currently
# belt-and-braces, and it is written the same way as release.yml so the two stay
# one expression to read rather than two to compare.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  ios:
    # This is the list of iOS versions the client is built and tested against,
    # one entry per version: the version, and the runner image that carries that
    # version's Xcode and simulator runtime. Adding a version is an entry here
    # and nothing else in this file, so it is a list to extend rather than a job
    # to duplicate.
    #
    # The image travels WITH the version rather than sitting on the job, because
    # the image is what supplies the SDK. macos-26 ships Xcode 26 and the iOS
    # 26.x runtimes, and no iOS 27 runtime at all; iOS 27 arrives with Xcode 27
    # on the `xcode-27` image, which GitHub publishes as a public preview
    # outside its SLA. A job pinned to one image cannot express both, and the
    # failure would be a confusing missing-simulator error on one leg rather
    # than anything naming the SDK as the cause.
    #
    # That SLA exception is accepted deliberately and only for the leg that
    # cannot exist without it: iOS 27 has no stable image yet, and testing
    # against an unreleased-but-shipping iOS is the point of this matrix rather
    # than an accident of it. The iOS 26 leg stays on the SLA-covered image.
    #
    # The versions are majors rather than exact releases on purpose. Simulator
    # runtimes are pinned to whatever the image carries, the resolver below
    # takes the newest minor inside the major, and an image roll moving 26.4 to
    # 26.5 should not turn this file red.
    strategy:
      # One version failing must not cancel the others, which is the default
      # and is wrong here: a cancelled leg reads as a run that never finished,
      # and the whole point of the matrix is to learn which versions break.
      fail-fast: false
      matrix:
        include:
          - ios: 26
            runner: macos-26
          - ios: 27
            runner: xcode-27
    # Named so the run list says which version a leg is, rather than the
    # default expansion of every matrix key including the image.
    name: iOS ${{ matrix.ios }}
    # The image is named in the matrix rather than `macos-latest`, so the
    # platform each leg runs on is a property of the file rather than of
    # whatever the alias resolves to that week.
    runs-on: ${{ matrix.runner }}
    # Every xcodebuild step runs in mobile/, where project.yml and the generated
    # project live. Paths on steps that do not care are unaffected.
    defaults:
      run:
        working-directory: mobile
    # A hung simulator boot would otherwise hold a runner until GitHub kills the
    # job at its much longer ceiling.
    timeout-minutes: 40
    steps:
      # Left to resolve its own ref. Each leg has its own checkout, and for a
      # pull_request the default is already the merge commit this gate is
      # supposed to judge.
      - uses: actions/checkout@v4

      # Which Xcode is used is chosen here rather than left to the image's
      # default, and the newest installed one wins.
      #
      # This deliberately does NOT pin a version, and that is a correction. An
      # earlier revision required Xcode 27 by name, on the belief that macos-26
      # carried it. The first real run proved otherwise: this image ships 26.0.1
      # through 26.6, and Xcode 27 lives on the separate `xcode-27` preview
      # image. Pinning a version the runner does not have fails every run, and
      # pinning one it does have fails the day GitHub rolls the image forward.
      #
      # The requirement that is actually true is a floor: Swift 6 language mode
      # (SWIFT_VERSION 6.0 in project.yml) needs the Xcode 16 toolchain or
      # newer. That is what gets checked.
      #
      # The version is read back out of each bundle rather than matched by
      # filename, because the bundle name is not stable. This repo's own
      # development machine has it at /Applications/Xcode-27.0.0.app, while the
      # runner has /Applications/Xcode_26.6.app alongside an unversioned
      # /Applications/Xcode.app pointing at the same build.
      - name: Select Xcode
        run: |
          set -eo pipefail

          chosen_line="$(
            for bundle in /Applications/Xcode*.app; do
              [ -d "$bundle" ] || continue
              version="$(DEVELOPER_DIR="$bundle/Contents/Developer" xcodebuild -version 2>/dev/null | head -1 | sed 's/^Xcode //' || true)"
              [ -n "$version" ] || continue
              printf '%s %s\n' "$version" "$bundle"
            done | sort -V | tail -1
          )"

          if [ -z "$chosen_line" ]; then
            echo "::error::no usable Xcode found under /Applications"
            ls -d /Applications/Xcode*.app 2>/dev/null || echo "no Xcode bundles at all"
            exit 1
          fi

          version="${chosen_line%% *}"
          bundle="${chosen_line#* }"
          major="${version%%.*}"

          if [ "$major" -lt 16 ]; then
            echo "::error::newest Xcode is $version, and the project needs the Xcode 16 toolchain or newer for Swift 6 language mode"
            exit 1
          fi

          chosen="$bundle/Contents/Developer"

          # DEVELOPER_DIR is exported for every later step rather than used for
          # this one only. It is what xcodebuild, xcrun and simctl all read, so
          # the simulator list below comes from the same toolchain that builds.
          echo "DEVELOPER_DIR=$chosen" >> "$GITHUB_ENV"
          echo "using $bundle (Xcode $version)"
          "$chosen/usr/bin/xcodebuild" -version
          xcrun simctl list runtimes

      # xcodegen is not part of Xcode and the image may or may not carry it.
      # HOMEBREW_NO_AUTO_UPDATE keeps the install from spending a minute
      # updating the tap index for one formula.
      - name: Install xcodegen
        run: |
          set -eo pipefail
          if ! command -v xcodegen >/dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version

      # Claw.xcodeproj is generated, not committed: mobile/project.yml is the
      # single source of truth for the project's shape and the .gitignore says
      # so. The checkout therefore has no project in it at all, and this step is
      # what makes the next two possible.
      - name: Generate the Xcode project
        run: xcodegen generate

      # Gate 1, compile. Building for the simulator rather than for a device is
      # what keeps this free of Apple credentials, and the generic destination
      # compiles every target in the scheme without picking a simulator yet.
      #
      # This gate catches a source error in the app. It cannot catch a mistake
      # in the test bundle, because the scheme pulls ClawTests in for the test
      # action only, which is the point of Gate 2.
      - name: Build for the simulator
        run: |
          set -eo pipefail
          xcodebuild \
            -project Claw.xcodeproj \
            -scheme Claw \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            build

      # The simulator is resolved from the runner's own list rather than named.
      # The image's simulator set differs from any given development machine's,
      # so a hardcoded name is the classic way this job fails: it is present
      # locally and absent there, and the failure reads as a bad destination
      # rather than a bad assumption. iPhone only, because the project targets
      # iPhone (TARGETED_DEVICE_FAMILY is 1).
      #
      # It is resolved against THIS MATRIX ENTRY's version, and that is a
      # correction rather than a tidy-up. Taking the newest runtime on the box
      # would let the iOS 26 leg pick up an iOS 27 simulator the moment one
      # appears on macos-26, so the leg would go on passing while testing a
      # version it was never asked to test. The runtime's major version must
      # equal the entry's, and the newest minor inside that major wins, which
      # is the only part left free to drift with the image.
      #
      # No runtime of that major is a loud failure naming the version. The leg
      # genuinely cannot verify that version, and falling back to another major
      # would be exactly the silent wrong-version pass this check exists to
      # prevent.
      #
      # The JSON form of the same command is used because it is the one that can
      # be parsed without guessing at column widths.
      - name: Resolve an available iPhone simulator
        env:
          IOS_MAJOR: ${{ matrix.ios }}
        run: |
          set -eo pipefail

          sim="$(xcrun simctl list devices available --json | python3 -c '
          import json, os, re, sys
          wanted = int(os.environ["IOS_MAJOR"])
          devices = json.load(sys.stdin)["devices"]
          best = None
          for identifier, entries in devices.items():
              match = re.search(r"SimRuntime\.iOS-([0-9-]+)$", identifier)
              if not match:
                  continue
              version = tuple(int(part) for part in match.group(1).split("-"))
              if version[0] != wanted:
                  continue
              for device in entries:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      if best is None or version > best[0]:
                          best = (version, device["udid"])
                      break
          if best is None:
              sys.exit(1)
          print(best[1])
          ' || true)"

          if [ -z "$sim" ]; then
            echo "::error::no available iPhone simulator on iOS $IOS_MAJOR on this runner, so the iOS $IOS_MAJOR leg has nothing to verify against. Runtimes this image does carry:"
            xcrun simctl list runtimes || true
            xcrun simctl list devices available || true
            exit 1
          fi

          echo "SIMULATOR_UDID=$sim" >> "$GITHUB_ENV"
          echo "resolved simulator for iOS $IOS_MAJOR:"
          xcrun simctl list devices available | grep -F "$sim" || true

      # Gate 2, the real verification: unit tests plus the parity suites, which
      # are the ones that compare the client's behaviour against core rather
      # than against itself.
      #
      # A GUI boot check is deliberately not attempted here. desktop/scripts/
      # smoke.js is the strongest check the desktop app has, and it cannot run
      # on GitHub's macOS runners (measured: no output, 30s timeout), so a
      # launch gate would fail for a reason that has nothing to do with the
      # code. That is why this gate is build plus tests and stops there.
      - name: Test on the resolved simulator
        run: |
          set -eo pipefail
          xcodebuild \
            -project Claw.xcodeproj \
            -scheme Claw \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            test
