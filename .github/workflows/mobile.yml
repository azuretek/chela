name: Claw mobile CI

# The iOS client lives in mobile/ and imports core/, the shared library. Until
# this workflow existed, neither was built on CI: release.yml builds the desktop
# app and deliberately skips `mobile/**`, so the first sign of a broken Swift
# build was somebody building by hand.
#
# This is the compile-and-test half of the mobile pipeline. The publish half is
# deliberately absent rather than forgotten: the distribution channel (ad-hoc
# OTA against TestFlight) is still undecided, and that choice is what decides
# signing, export and upload. Nothing here may grow to need an Apple
# credential, and nothing here signs anything.

# Two ways in, and they mean the same thing here:
#
#   push to main       whatever just landed in mobile/ or core/ is built.
#   pull_request       the same paths, before they land.
#   workflow_dispatch  any ref, on demand.
#
# `paths` names what this workflow depends on rather than what it ignores.
# `core/**` is the non-obvious entry: the client consumes the shared library, so
# a change confined to core/ can break this build while leaving the desktop
# alone, and a filter of `mobile/**` alone would skip exactly that run. No docs
# or config path appears here, because none of them can change what compiles.
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'core/**'
      # A workflow that cannot run on its own change is one nobody can fix.
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'core/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

# Pushing three commits in a minute should build the last one, not all three.
# Tag builds are exempt: a release run must never be cancelled by anything.
# Nothing here is triggered by a tag today, so the guard is currently
# belt-and-braces, and it is written the same way as release.yml so the two stay
# one expression to read rather than two to compare.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  ios:
    # Xcode 27 does not run on an older macOS, and `macos-latest` is not pinned
    # to this one yet. The version is named so the toolchain this build claims
    # to use is a property of the file rather than of whatever the alias
    # resolves to that week.
    runs-on: macos-26
    # Every xcodebuild step runs in mobile/, where project.yml and the generated
    # project live. Paths on steps that do not care are unaffected.
    defaults:
      run:
        working-directory: mobile
    # A hung simulator boot would otherwise hold a runner until GitHub kills the
    # job at its much longer ceiling.
    timeout-minutes: 40
    steps:
      # Left to resolve its own ref. There is one job here, so there is no
      # second checkout to disagree with, and for a pull_request the default is
      # already the merge commit this gate is supposed to judge.
      - uses: actions/checkout@v4

      # The runner's default Xcode is not necessarily 27. A preview image pins
      # the generally available Xcode as the default, so building without
      # choosing would compile the client against an older SDK, with a
      # different compiler and a different simulator set, and it would look
      # like it worked.
      #
      # The toolchain is therefore chosen by reading the version back out of
      # each installed bundle, never by matching a filename: the bundle name is
      # not stable. This repo's own development machine has it at
      # /Applications/Xcode-27.0.0.app, which is versioned, and the runner's
      # may be unversioned or use an underscore instead.
      #
      # A missing Xcode 27 is a hard failure that lists what is installed. The
      # one thing this must never do is continue on an older Xcode.
      - name: Select Xcode 27
        run: |
          set -eo pipefail

          chosen=""
          for bundle in /Applications/Xcode*.app; do
            [ -d "$bundle" ] || continue
            version="$(DEVELOPER_DIR="$bundle/Contents/Developer" xcodebuild -version 2>/dev/null | head -1 || true)"
            echo "found $bundle: ${version:-unknown}"
            case "$version" in
              "Xcode 27"*) chosen="$bundle/Contents/Developer"; break ;;
            esac
          done

          if [ -z "$chosen" ]; then
            echo "::error::no Xcode 27 under /Applications; the iOS client is built against Xcode 27 and this workflow will not fall back to an older SDK"
            ls -d /Applications/Xcode*.app 2>/dev/null || echo "no Xcode bundles found at all"
            xcodebuild -version || true
            exit 1
          fi

          # DEVELOPER_DIR is exported for every later step rather than used for
          # this one only. It is what xcodebuild, xcrun and simctl all read, so
          # the simulator list below comes from the same toolchain that builds.
          echo "DEVELOPER_DIR=$chosen" >> "$GITHUB_ENV"
          echo "using $chosen"
          "$chosen/usr/bin/xcodebuild" -version
          xcrun simctl list runtimes

      # xcodegen is not part of Xcode and the image may or may not carry it.
      # HOMEBREW_NO_AUTO_UPDATE keeps the install from spending a minute
      # updating the tap index for one formula.
      - name: Install xcodegen
        run: |
          set -eo pipefail
          if ! command -v xcodegen >/dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version

      # Claw.xcodeproj is generated, not committed: mobile/project.yml is the
      # single source of truth for the project's shape and the .gitignore says
      # so. The checkout therefore has no project in it at all, and this step is
      # what makes the next two possible.
      - name: Generate the Xcode project
        run: xcodegen generate

      # Gate 1, compile. Building for the simulator rather than for a device is
      # what keeps this free of Apple credentials, and the generic destination
      # compiles every target in the scheme without picking a simulator yet.
      #
      # This gate catches a source error in the app. It cannot catch a mistake
      # in the test bundle, because the scheme pulls ClawTests in for the test
      # action only, which is the point of Gate 2.
      - name: Build for the simulator
        run: |
          set -eo pipefail
          xcodebuild \
            -project Claw.xcodeproj \
            -scheme Claw \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            build

      # The simulator is resolved from the runner's own list rather than named.
      # The image's simulator set differs from any given development machine's,
      # so a hardcoded name is the classic way this job fails: it is present
      # locally and absent there, and the failure reads as a bad destination
      # rather than a bad assumption. Highest iOS runtime first, iPhone only,
      # because the project targets iPhone (TARGETED_DEVICE_FAMILY is 1).
      #
      # No simulator at all is a loud failure. The JSON form of the same command
      # is used because it is the one that can be parsed without guessing at
      # column widths.
      - name: Resolve an available iPhone simulator
        run: |
          set -eo pipefail

          sim="$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          def runtime_order(identifier):
              match = re.search(r"iOS-(\d+)-(\d+)$", identifier)
              return (int(match.group(1)), int(match.group(2))) if match else (0, 0)
          for identifier in sorted(devices, key=runtime_order, reverse=True):
              if not identifier.startswith("com.apple.CoreSimulator.SimRuntime.iOS"):
                  continue
              for device in devices[identifier]:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      print(device["udid"])
                      sys.exit(0)
          sys.exit(1)
          ' || true)"

          if [ -z "$sim" ]; then
            echo "::error::no available iPhone simulator on this runner; the unit and parity tests cannot run without one"
            xcrun simctl list devices available || true
            exit 1
          fi

          echo "SIMULATOR_UDID=$sim" >> "$GITHUB_ENV"
          echo "resolved simulator:"
          xcrun simctl list devices available | grep -F "$sim" || true

      # Gate 2, the real verification: unit tests plus the parity suites, which
      # are the ones that compare the client's behaviour against core rather
      # than against itself.
      #
      # A GUI boot check is deliberately not attempted here. desktop/scripts/
      # smoke.js is the strongest check the desktop app has, and it cannot run
      # on GitHub's macOS runners (measured: no output, 30s timeout), so a
      # launch gate would fail for a reason that has nothing to do with the
      # code. That is why this gate is build plus tests and stops there.
      - name: Test on the resolved simulator
        run: |
          set -eo pipefail
          xcodebuild \
            -project Claw.xcodeproj \
            -scheme Claw \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            test
