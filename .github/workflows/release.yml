name: claw-desktop release

# The Electron app lives in desktop/ since the repo became the product monorepo
# (core/ shared, desktop/ this app, mobile/ the iOS client). Every npm/script
# step runs inside desktop/ via defaults.run.working-directory on each job that
# builds; the release job runs at the repo root because it only moves artifacts.

# Builds each platform on its own runner. Cross-building the Windows installer
# from macOS needs Wine for resource editing, so a native Windows runner is the
# supported path rather than a local convenience.
#
# Three ways in, and they mean different things:
#
#   push to main       a dev build of whatever just landed, versioned
#                      `X.Y.Z-dev.<count>.<sha>`, published as a GitHub
#                      PRE-release on the `dev` update channel.
#   tag `v*`           a release. The tag must equal package.json, checked
#                      before anything is built, and the installers are
#                      published as a full GitHub Release on `latest`.
#   workflow_dispatch  a dev build of any ref, on demand.
#
# Both kinds publish, because a GitHub Release is the only way to hand someone a
# raw `.dmg` or `.exe`: workflow artifacts are always zipped by GitHub and that
# is not configurable. The two are kept apart by channel, not by trust, see the
# `prerelease` input below and `channelOf()` in src/updates.js.
#
# ★ There is no path filter here any more, and that is the rule rather than a
# simplification. A path filter used to decide whether a release WAITED for the
# other platform, and its answer for a commit confined to one client's tree was
# "publishing is unaffected". Which paths SHIP is still a real question, and it
# is now answered in ONE place for both pipelines, by `scripts/release/changes.mjs`
# through the `changes` job below. The two answers are not the same answer:
#
#   a commit that ships    runs BOTH pipelines, and nothing is published until
#                          every desktop leg, both iOS legs and the TestFlight
#                          upload are green. There is no per-path escape left on
#                          a release commit, which is the whole point: a
#                          desktop-only commit used to publish a GitHub Release
#                          (the feed the phone reads) while no TestFlight build
#                          existed behind it.
#   a commit that ships nothing   still builds, tests and lints, and publishes
#                          NOTHING: no version bump, no GitHub Release, no
#                          TestFlight upload. A .github-only change is this case,
#                          and it is the one that produced the phantom update
#                          v1.0.1-dev.279.9a58115cb1.
#
# GitHub does not evaluate path filters for tag pushes, so a tag release could
# never be skipped by one; with no filter at all that is true of every event.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# ★ This workflow does not publish on its own any more. Publication waits on the
# mobile pipeline too, because a release needs the whole matrix green rather than
# each platform's own jobs: on 2026-09-16 this workflow published a release for a
# commit whose mobile pipeline was red, and no job in either file could see the
# other. The `platforms` job below reads the mobile pipeline's verdict for this
# commit and is part of the release job's `needs`, so a red mobile leg skips
# publishing here exactly as a red leg of our own does. `platforms-gate.yml` owns
# what is waited on; `CONVENTIONS.md` in this directory owns the rule and where to
# look when a release did not happen.
#
# ★ And the wait has no per-path escape left in it, which is the other half of
# the same rule (Abi, 2026-09-18): "do not publish until literally all platforms
# are green and artifacts are ready and testflight release is ready". A commit
# that ships can no longer be told "the other pipeline has no run, so publishing
# is unaffected", because this workflow no longer carries a path filter for that
# answer to come from, and `platforms-gate.yml` treats a missing run as a
# refusal. Every commit that reaches the release job has therefore been built,
# tested and uploaded on both platforms first.

# Pushing three commits in a minute should build the last one, not all three.
# Tag builds are exempt: a release run must never be cancelled by anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # ★ Whether this commit ships anything at all, which is the question that now
  # decides whether a release happens rather than whether a release waits.
  #
  # The trigger set has ONE owner, `scripts/release/changes.mjs`, and this job is
  # the only place either pipeline asks it. Neither workflow carries a path filter
  # for a test to keep in step (`desktop/test/release-trigger.test.js` asserts
  # that), because the filter is what let a release out with no iOS build behind
  # it. The paths a diff is taken over:
  #
  #   a push        the push itself, previous commit..this one
  #   a tag         everything since the last release tag, which is what that
  #                 release would SHIP rather than only its tip commit
  #   a dispatch    the same range as a tag
  #
  # A tag and a dispatch are both an explicit "release this", so where they find
  # nothing shipped the job REFUSES rather than standing down: a release that was
  # asked for and quietly did not happen is its own bug. A push that ships
  # nothing is the ordinary case and stands down quietly, with its own CI still
  # green beside it.
  changes:
    name: does this commit ship anything
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      # Full history, because the answer is a diff and its base may be a release
      # tag from weeks ago rather than the previous commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: decide
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/release/changes.mjs

  # Runs once, on the cheapest runner, before either platform build starts. It
  # settles two things: what version this build carries, and whether it should
  # happen at all. A tag that disagrees with package.json is caught here in
  # seconds rather than after two three-minute builds have produced misnamed
  # installers.
  version:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    outputs:
      version: ${{ steps.decide.outputs.version }}
      build: ${{ steps.decide.outputs.build }}
      tagged: ${{ steps.decide.outputs.tagged }}
    steps:
      # Tags are needed to spot a commit that is being released: `git push
      # --follow-tags` raises a branch event and a tag event for the same commit,
      # and only the tag one should build.
      #
      # `ref` is pinned for the reason given on the build job's checkout: this
      # run has one commit, and every job must read the same one.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: decide
        run: node scripts/build-version.js

  # ★ The whole matrix, not just this platform, before anything is published.
  #
  # This job is what makes a desktop release wait on the MOBILE pipeline. It runs
  # beside `build` rather than after it, so the wait for the other platform
  # overlaps the three installers being built instead of following them, and it is
  # named after what it waits for so a blocked release says which platform it is
  # blocked on without anyone reading a log.
  #
  # It stands down when this workflow is not building at all, which is the same
  # condition `build` uses: there is nothing to gate when nothing publishes.
  platforms:
    name: every platform must be green
    needs: [version, changes]
    # Only a commit that ships has anything to gate: a commit that publishes
    # nothing has no release for a red platform to hold up, and its CI runs
    # beside this job rather than through it.
    if: needs.version.outputs.build == 'true' && needs.changes.outputs.release == 'true'
    permissions:
      actions: read
    uses: ./.github/workflows/platforms-gate.yml
    with:
      # The other pipeline, by the name GitHub's run list reports it under, and
      # the jobs that must be green before anything here is published: the mobile
      # test matrix (one leg per iOS version), its lint, and its `release` job.
      #
      # ★ `^release$` is what makes "all builds and the TestFlight release
      # READY before publishing" true. That job is where the upload to TestFlight
      # and the wait for the build to reach VALID live, so requiring it green
      # means the GitHub Release (the feed both clients read) is not published
      # until the phone build is actually installable. Without it, publishing
      # waited only on the iOS TEST legs, and the feed could appear while
      # TestFlight was still Processing. That is the gap Abi named 2026-09-18:
      # "CI should ensure all builds and the testflight release is ready before
      # publishing."
      #
      # `^swiftlint$` is included so a red mobile lint cannot slip through: a
      # failed lint skips the mobile `release` job, and an absent job is not a
      # red one, so without this the gate would read "nothing wrong" from a lint
      # that never ran the upload.
      #
      # NOT a deadlock, and this replaces an earlier note here that said the
      # release job waits on this workflow in turn. It does not: the mobile gate
      # waits on THIS workflow's `^build` jobs only, which depend on nothing in
      # the mobile run. So the order is desktop build -> mobile gate -> mobile
      # release (upload + VALID) -> this gate -> desktop publish, with no cycle.
      platform: claw-mobile pipeline
      verdict: '^iOS |^swiftlint$|^release$'
      # ★ 90 minutes, because of what this now waits for. The verdict names the
      # mobile `release` job, and that job's own budget is 60 minutes: an archive,
      # an export, an upload, and then a wait of up to 45 minutes for the build to
      # reach VALID in App Store Connect. The gate's default of 45 would give up
      # while that job is still legitimately waiting on Apple, and refuse a
      # release whose TestFlight build was about to become installable.
      #
      # A refusal is the safe direction, but it is still a release that did not
      # happen, which the rule treats as its own bug. 90 minutes is above the
      # mobile job's whole budget, so the gate now only ever gives up on a run
      # that has already been killed, and reports that rather than a timeout it
      # invented. It costs nothing on a healthy push: the gate is idle waiting
      # either way, and measured 2026-09-17 it was 5 m 58 s in practice.
      window: 90

  # ★ The JS import lint, once, at the repo root. This is the off-the-shelf guard
  # for the boot-fatal class that shipped a green-tested build to a fatal dialog:
  # a DEFAULT import of a module that has only NAMED exports (issue-reporter.js
  # importing core/issue-report.js, fixed by hand in b9b5112). eslint-plugin-import's
  # import/default, import/named and import/no-unresolved check the imported
  # BINDING statically across core and desktop, which no unit test and no source
  # audit did. It runs once here rather than in the per-platform build matrix
  # because linting is platform-independent, and it installs with pnpm because the
  # eslint config and its dependencies live at the workspace root. Mobile is Swift
  # and linted by SwiftLint in the mobile pipeline, not here.
  #
  # It runs on every trigger of this workflow (no build gate), because a lint
  # failure should be visible on a change that does not itself publish; the build
  # job below gates publication on it via needs.
  lint:
    name: js import lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint:js

  build:
    needs: [version, lint]
    if: needs.version.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: build:mac
            artifact: macos
          - os: windows-latest
            script: build:win
            artifact: windows
          # One x64 runner covers both AppImage architectures. An AppImage is
          # its target's runtime concatenated with a squashfs image, and
          # electron-builder downloads the runtime per architecture, so nothing
          # here is compiled for the host CPU and no arm64 runner is needed.
          - os: ubuntu-latest
            script: build:linux
            artifact: linux
    runs-on: ${{ matrix.os }}
    # Where electron and electron-builder keep what they download, pointed at a
    # directory this job caches rather than left to each runner's default. The
    # paths below are the cache's, so one step serves all three legs: the default
    # locations differ per OS (~/Library/Caches on macOS, ~/.cache on Linux,
    # %LOCALAPPDATA% on Windows) and a cache keyed on a guessed path silently
    # restores nothing.
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    defaults:
      run:
        working-directory: desktop
    steps:
      # Pinned to the commit this run was triggered for, not left to resolve a
      # branch name. Without it each job checks out whatever the tip happens to
      # be when that job starts, and there are two checkouts here: the version
      # job derives `X.Y.Z-dev.<count>.<sha>` from its HEAD, and beforePack
      # stamps src/build-info.json from this one. A push landing between them --
      # or any workflow_dispatch, which always resolves the branch tip -- makes
      # those two name different commits, so the installer is named for one
      # commit and reports another in Settings. That is precisely the question
      # build-info.json exists to answer.
      #
      # Depth stays 1: this job only needs HEAD's sha and dirty state, and the
      # version is handed to it via CLAW_BUILD_VERSION.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # ★ Cached, because a fresh runner starts with both of these empty and
      # electron-builder refetches its inputs every time: the Electron
      # distribution per architecture it packages (two here), its icons bundle,
      # dmgbuild on macOS, and the signing/NSIS tools on Windows. Measured
      # 2026-09-17 on the macos leg, each Electron fetch is seconds rather than
      # minutes, so this buys seconds per leg; it is here as much for the other
      # half, because that fetch is a network dependency that has already cost a
      # release: the Linux leg that failed run 35264344454 died in an Electron
      # install, not in a test, and the release job is gated on every leg.
      #
      # The key carries the OS and the lockfile, so an Electron upgrade misses it
      # and a leg never restores another platform's binaries; the restore-key
      # keeps a lockfile bump from throwing away everything.
      - uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # The workspace install, at the repo root rather than in desktop/. desktop
      # depends on core as "claw-core": "workspace:*", which pnpm resolves as a
      # symlink and npm ci cannot resolve at all (it failed every build leg with
      # `Unsupported URL Type "workspace:"`). --frozen-lockfile pins to the
      # committed pnpm-lock.yaml, the CI equivalent of npm ci. working-directory
      # is overridden to the root for this one step; the build steps below stay in
      # desktop/.
      - name: Install the workspace
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile

      # Electron's postinstall has intermittently left its dist/ incomplete: on
      # Windows ("failed to create directory ...\dist\locales: ... os error 183")
      # and on Linux ("failed to create .../dist/electron: File exists (os error
      # 17)"). Every test that imports electron then throws "Electron failed to
      # install correctly". Each has failed a release run and passed on a plain
      # re-run. Repair it here rather than fail a release on an install flake, and
      # keep a hard check after the repair so a genuinely broken install still
      # fails.
      #
      # Deliberately NOT gated on a runner OS. It used to read runner.os ==
      # 'Windows', and that gate is why run 35264344454's Linux leg skipped this
      # step and died in Test with 445 pass and that one install failure. The
      # release job is gated on every build leg, so that flake skipped publication
      # outright and the fix the push was carrying shipped nowhere.
      #
      # The leftover dist/ is deleted before the rebuild because the failure is an
      # extractor refusing to overwrite what it half-wrote: re-running the install
      # script over the same partial tree repeats the same os error. Electron
      # caches the download, so this costs an extraction rather than a fetch.
      #
      # The check resolves the binary's path instead of only importing the module,
      # because require('electron') throws only when path.txt is missing. A dist/
      # whose binary was never extracted imports cleanly and then fails every test.
      - name: Ensure Electron is usable
        shell: bash
        run: |
          electron_usable() {
            node -e "const fs=require('fs'),p=require('electron');if(!fs.existsSync(p))throw new Error('electron binary missing at '+p)"
          }
          if ! electron_usable 2>/dev/null; then
            echo "electron install incomplete; fetching"
            # electron 44 has no install script: it downloads its binary lazily on
            # first require, and `node -e "require('electron')"` is what triggers
            # that. Under pnpm the package lives in the virtual store, so a
            # `rm -rf node_modules/electron/dist` + rebuild is the wrong tree to
            # touch; forcing the download through the install entrypoint is the
            # portable repair. If it still cannot resolve afterwards, the check
            # below fails the leg rather than letting a broken install reach Test.
            node node_modules/electron/install.js || true
          fi
          electron_usable >/dev/null && echo "electron loads"

      - name: Test
        run: npm test

      # Apple credentials, exported for the mac leg only.
      #
      # A separate step rather than entries on Build, because these must not
      # exist at all on the Windows runner: to electron-builder, CSC_LINK there
      # means a *Windows* signing certificate, so a matrix-wide value would make
      # it try to sign the .exe with a Developer ID. Skipping the step leaves
      # them genuinely unset rather than set-but-empty, which is the difference
      # between "not configured" and "configured with nothing".
      #
      # Each is written only when it has a value, so a fork with no secrets
      # produces an unsigned build instead of failing, the same rule the mac
      # block in electron-builder.yml follows.
      #
      # notarytool takes a key *file*, not a key value, so the .p8 is written to
      # the runner's temp directory, which is destroyed with the job.
      #
      # The signing keychain is built HERE rather than left to electron-builder,
      # and CSC_LINK is deliberately not exported. Given CSC_LINK, macPackager
      # calls macCodeSign.createKeychain, which makes a temporary keychain with a
      # random password of its own and then runs `security set-key-partition-list`
      # against it, and that intermittently fails with "SecKeychainUnlock: The
      # user name or passphrase you entered is not correct". Its own password, on
      # its own keychain, rejected at random: the same commit with the same
      # secrets passed on a rerun. Given CSC_KEYCHAIN and no CSC_LINK it takes the
      # other branch (`{ keychainFile: process.env.CSC_KEYCHAIN }`) and creates no
      # keychain at all, so the flake has nowhere to happen.
      #
      # That branch also skips electron-builder's bundled root_certs keychain,
      # which is where the Apple intermediates would have come from, so the G2
      # intermediate is imported here too. Without it codesign fails "unable to
      # build chain to self-signed root", and note that `security verify-cert`
      # passes anyway, so only a real signing attempt proves this one.
      - name: Apple signing credentials
        if: matrix.artifact == 'macos'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -eo pipefail

          if [ -n "$APPLE_API_KEY_P8" ]; then
            key="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$key"
            chmod 600 "$key"
            echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
          fi
          for name in APPLE_API_KEY_ID APPLE_API_ISSUER; do
            eval "value=\$$name"
            if [ -n "$value" ]; then echo "$name=$value" >> "$GITHUB_ENV"; fi
          done

          # A fork with no secrets builds unsigned rather than failing, the same
          # rule the mac block in electron-builder.yml follows.
          if [ -z "$CSC_LINK" ]; then
            echo "no signing certificate configured; this build will be unsigned"
            exit 0
          fi

          kc="$RUNNER_TEMP/claw-signing.keychain-db"
          p12="$RUNNER_TEMP/signing.p12"
          printf '%s' "$CSC_LINK" | base64 --decode > "$p12"
          chmod 600 "$p12"

          curl -fsS --retry 3 -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer

          # Both passwords reach `security` on stdin, never in argv, so neither
          # can be read out of `ps` by anything else on the runner. `security -i`
          # takes one command per line.
          kcpw="$(openssl rand -base64 24)"
          security -i <<SEC
          create-keychain -p "$kcpw" "$kc"
          set-keychain-settings "$kc"
          unlock-keychain -p "$kcpw" "$kc"
          import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$kc" -T /usr/bin/codesign
          import "$p12" -k "$kc" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc"
          SEC
          rm -f "$p12"

          # "filename will not be searched to resolve the signing identity's
          # certificate chain unless it is also on the user's keychain search
          # list", and `list-keychains -s` REPLACES that list, so the existing
          # entries are read back and passed through rather than dropped.
          existing=()
          while IFS= read -r line; do
            line=$(printf '%s' "$line" | sed 's/^[[:space:]]*"//; s/"[[:space:]]*$//')
            if [ -n "$line" ]; then existing+=("$line"); fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$kc" "${existing[@]}"

          # The whole point of owning the keychain: signing readiness becomes a
          # checked precondition instead of something discovered three minutes
          # later as a warning in a build that still exits 0.
          if ! security find-identity -v -p codesigning "$kc" | grep -q 'Developer ID Application'; then
            echo "::error::no Developer ID Application identity in the signing keychain"
            security find-identity -v "$kc" || true
            exit 1
          fi

          echo "CSC_KEYCHAIN=$kc" >> "$GITHUB_ENV"
          echo "signing identity ready in $kc"

      # scripts/build.js owns "what version is this build" for local builds and
      # CI alike. CLAW_BUILD_VERSION is the override it honours, so the version
      # job stays the authority here without CI needing its own flag, and a
      # developer running `npm run build:mac` gets the same naming scheme.
      #
      # CSC_IDENTITY_AUTO_DISCOVERY is deliberately not set false any more. It
      # gates the identity search outright (app-builder-lib's macCodeSign), so
      # leaving it false would silently skip signing even with CSC_LINK present.
      - name: Build
        run: npm run ${{ matrix.script }}
        env:
          CLAW_BUILD_VERSION: ${{ needs.version.outputs.version }}

      # The unit tests above run under Node against the source tree, so they
      # cannot see a fault that only appears once the app is packaged: a module
      # the packer never copied, a shared file at a path the relative import does
      # not reach, an entry Electron refuses to load. Each of those shipped a
      # build that passed every test and then failed on launch.
      #
      # check:imports audits the source (wrong-depth relative paths, CommonJS
      # packages imported by name). check:package audits the artifact built two
      # steps up: the files it must contain, and every relative import re-resolved
      # against the packaged layout.
      #
      # Both are headless deliberately. scripts/smoke.js boots the real app and is
      # the strongest check, but a GUI Electron app will not start on GitHub's
      # macOS runners (measured: no output, no config written, 30s timeout), so a
      # boot gate here is not portable across the matrix. smoke.js runs on every
      # platform locally instead: `npm run smoke`, `npm run smoke:packed`.
      - name: Check imports and the packaged app
        run: |
          npm run check:imports
          npm run check:package

      - uses: actions/upload-artifact@v4
        with:
          name: claw-${{ matrix.artifact }}-${{ needs.version.outputs.version }}
          # Stored, not compressed. Every payload here is an installer or an
          # updater archive, meaning the bytes are already compressed, so the
          # default deflate pass spends CPU on the runner and again in the
          # release job's download for a file that cannot shrink. Measured
          # 2026-09-17, this step was 16 to 21 seconds on the macOS leg alone,
          # the largest single step in the release job's own critical path after
          # the build itself.
          compression-level: 0
          # Every build now publishes a Release, so these exist only to carry
          # files from the two build runners to the release job below, the
          # Release is the durable copy. They expire as fast as GitHub allows.
          # Retention here is age-only: GitHub offers no count-based limit for
          # artifacts, unlike the releases, which the prune step keeps to 10.
          retention-days: 1
          # Paths are relative to the repo, not to working-directory, so the
          # desktop/ prefix is required here even though the build ran in it.
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            # Update metadata, emitted because electron-builder.yml declares a
            # `publish` provider. An updater reads these to learn a release's
            # version, size and checksum; without them the release is just files.
            #
            # Both channels are named explicitly, not `*.yml`: a stable build
            # writes latest-mac.yml / latest.yml / latest-linux.yml and a dev
            # build writes dev-mac.yml / dev.yml / dev-linux.yml, while the build
            # also drops builder-debug.yml in dist/, which has no business in a
            # release.
            desktop/dist/latest*.yml
            desktop/dist/dev*.yml
            desktop/dist/*.blockmap

  release:
    needs: [version, changes, build, platforms]
    # Everything that built gets published; `prerelease` is what separates a dev
    # build from a release, not whether it is published at all.
    #
    # This `needs` and `if` are the gate Abi asked for on 2026-09-16: nothing is
    # published unless every build leg passes (`build`), every platform's installers
    # are in the release (the artifact gate below), and the OTHER pipeline's whole
    # matrix is green on this commit (`platforms`, `platforms-gate.yml`). The last
    # one is the half that was missing: this workflow used to publish while the
    # mobile pipeline was red, because each file gated only itself.
    #
    # Both results are asserted in the condition rather than left to the implicit
    # success requirement on `needs`, because the two are not the same thing: a
    # job-level `if` is not ANDed with it, which is why `mobile-pipeline.yml`
    # asserts its test matrix the same way. This `if` still takes no status
    # function (always(), !cancelled(), failure()); one of those would override the
    # success requirement outright and publish a partial release.
    #
    # ★ `changes` is the other half of the gate, and it is new: it is what makes
    # a commit that ships NOTHING publish nothing at all. Abi's rule, 2026-09-18:
    # "we only need a release if something actually changed, so docs and other
    # things like that definitely do not need a release at all". A release for a
    # .github-only commit was not only unnecessary, it was the phantom update the
    # phone offered (v1.0.1-dev.279.9a58115cb1), so this is a correctness gate as
    # much as a cost one.
    if: needs.changes.outputs.release == 'true' && needs.version.outputs.build == 'true' && needs.build.result == 'success' && needs.platforms.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The release body is generated from this repo's own commits, so this job
      # needs a checkout and every tag with it. It used to have neither: it only
      # moved files from the build runners into the Release.
      #
      # Depth 0 because the range starts at the previous tag and git cannot
      # describe a tag it never fetched.
      #
      # This runs BEFORE the artifacts are downloaded, not after: checkout cleans
      # the workspace by default, and its `git clean` would delete the download
      # directory. A reversed order fails loudly rather than silently, because
      # `fail_on_unmatched_files` below then finds nothing to attach.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Nothing is published until every platform is in the release, with each
      # installer electron-builder declares for it and the update metadata an
      # updater reads. This runs before the release step rather than after it, for
      # the reason the whole job exists: a release that goes out missing a platform
      # cannot be recalled, and one published without its `dev-<platform>.yml` is a
      # release every client's updater walks past in silence.
      #
      # The check reads its platform list from the build matrix above and its
      # installer types from electron-builder.yml, so a platform or a target added
      # to either is gated the day it is added; desktop/test/release-artifacts.test.js
      # holds both readings to their sources.
      - name: Every platform must be in the release
        run: node desktop/scripts/check-release-artifacts.js artifacts

      # ★ A release is created as a DRAFT and published by the last step of this
      # job, once its whole asset set is attached and verified. That ordering is
      # the fix rather than a detail: what made a hollow release possible was
      # that creating, publishing and uploading were ONE step, so a release could
      # be live for everyone while its payload was still arriving, and a flake
      # left it that way forever.
      #
      # Measured on 2026-09-17, release v1.0.1-dev.205.810cdf80d4: it went out
      # carrying 10 of its 16 assets. The upload ran all 16 concurrently, the
      # first rejection failed the step with `##[error]Error saving asset` nine
      # seconds in, and the five that rejected after it were never reported at
      # all, because the concurrent batch (a `Promise.all` inside the action)
      # surfaces only the first rejection. What landed was the four update feeds
      # and four blockmaps; `Setup-x64.exe`, both `.zip` payloads, both `.dmg`s
      # and `arm64.AppImage` never arrived. Every client's updater resolved a
      # version whose downloads could never finish, which is a download card
      # that hangs at 0% and survives a restart, with nothing local to blame.
      #
      # The upload is two stages, and the split is measured rather than tidy. The
      # action's concurrent uploader is the fast one, roughly 600 MB in about 25
      # seconds, so it stays the bulk route onto the release. The completeness
      # check below is the verdict, and it refills whatever that uploader lost.
      # Uploading one file at a time was tried as the only route and abandoned
      # the same day: the first 127 MB file had not completed after 3m36s on a
      # runner, so the per-file path is a bounded top-up rather than the way the
      # payload travels.
      #
      # desktop/test/release-artifacts.test.js asserts that the artifact gate runs
      # before anything is uploaded, and anchors its second half on
      # `action-gh-release`. Publication is now the last step of this job rather
      # than the upload step, so the ordering that test protects holds by
      # construction; strengthening its anchor is app-code work and was left for
      # whoever next touches that test.
      #
      # A draft is invisible to a client: measured 2026-09-17, a draft tag is
      # absent from the unauthenticated releases feed (0 matches) and from a
      # `getReleaseByTag` lookup (404), and no tag ref exists for it until it is
      # published. So a client cannot resolve this version while its payload is
      # still arriving.
      #
      # `getReleaseByTag` not seeing drafts is also why a leftover draft has to
      # be cleared first: after a hard kill (runner death, or a cancellation
      # that lands between these steps) the draft survives, and the action would
      # look the tag up, miss it, and fail creating a second release for a tag
      # that already has one. Only OUR draft for THIS tag is cleared, and a
      # published release is left alone, which is what makes a rerun repair an
      # existing release in place instead of starting over.
      - name: Clear an abandoned draft for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          set -uo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG has no release yet"
            exit 0
          fi
          draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
          if [ "$draft" = 'true' ]; then
            echo "clearing the abandoned draft for $TAG"
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          else
            echo "$TAG already has a published release, and this run attaches to it"
          fi

      - name: Create the release as a draft
        uses: softprops/action-gh-release@v2
        with:
          # electron-updater resolves a release through its TAG, not through the
          # release title: GitHubProvider walks the releases feed, skips any tag
          # that fails `semver.valid`, and reads the channel from
          # `semver.prerelease(tag)[0]`. So the tag has to be `v<version>`, a
          # `dev-<version>` tag would be skipped by every updater, silently.
          #
          # For a dev build no such tag exists yet. The draft records
          # target_commitish, and publishing (last step of this job) creates the
          # tag from it: measured 2026-09-17, a tag created that way landed on
          # the recorded commit. That cannot start a second run either, because
          # GitHub raises no workflow event for anything pushed with
          # GITHUB_TOKEN. It does leave a tag on the commit, which
          # build-version.js is careful not to mistake for a release tag.
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          # GitHub never marks a prerelease as "Latest", so the front page keeps
          # pointing at the newest stable release on its own.
          prerelease: ${{ needs.version.outputs.tagged != 'true' }}
          # The body is GitHub's own grouping of MERGED PULL REQUESTS, which is
          # what it was meant to be all along. It had been switched to
          # commit-derived notes, git-cliff over the conventional subjects,
          # because this repo committed straight to main: there were no pull
          # requests to group, and every body came out as the compare link and
          # nothing else. Changes land as pull requests now, so the grouping has
          # something to work on again, and the notes name the change someone
          # reviewed rather than the commits it happened to arrive as.
          #
          # A deliberate gap, named rather than left to be found: GitHub starts
          # the range at the previous release, and dev builds ARE releases, so a
          # future STABLE release would get notes covering the last dev build
          # rather than the whole cycle. Nothing builds a stable release yet,
          # and the fix when one does is a start tag, `gh release create
          # --notes-start-tag`, which this action has no input for: the stable
          # path needs its own notes step the day it is real.
          generate_release_notes: true
          # Draft, and the whole set goes on here, because this uploader is the
          # one that reliably moves large files off a runner: it runs the 16
          # uploads concurrently and takes about 25 seconds over ~600 MB. It is
          # NOT trusted to have finished, though. `continue-on-error` is set
          # below deliberately, so a lost file cannot end the run before the next
          # step has had its say, and cannot be mistaken for a complete set
          # either: that step compares the release against the artifacts, refills
          # what is missing, and fails loudly with the draft withdrawn if it
          # cannot. The verdict is the asset set, never this step's exit code.
          #
          # A rerun against an already-published release keeps it published
          # (the action preserves an existing release's draft state) and the
          # attach step refills whatever that release is missing.
          draft: true
          files: artifacts/**/*
          # A release that publishes with no installers attached looks finished
          # and is useless; fail loudly instead.
          fail_on_unmatched_files: true
          # Never replaced, and that is a safety property rather than a
          # preference: this uploader DELETES an existing asset before uploading
          # its replacement, so on a rerun against a release that is already
          # published, a failed re-upload would take the published asset away and
          # leave the release hollow. Skipping means a rerun only ever adds what
          # is missing, and the completeness check below still fails the run if
          # the set cannot be completed.
          overwrite_files: false
        # ★ Bounded, because this uploader has no timeout anywhere and a stalled
        # large asset holds the step, and the verification behind it, open
        # indefinitely: measured 2026-09-17, a release job sat here for over 20
        # minutes having attached 14 of 16 assets, with no further progress, and
        # the two that were stuck were the largest. Thirty minutes is far more
        # than the ~25 seconds this step takes when the upload path is healthy,
        # so the bound only ever fires on a stall, and a stall is what the
        # completeness check below exists to convert into an answer.
        timeout-minutes: 30
        # ★ Deliberately tolerated, and it weakens nothing: the run's verdict is
        # the completeness check below, which is stricter than this step's exit
        # code ever was. Before this change the step both uploaded and PUBLISHED,
        # so its failure left a live release carrying 10 of its 16 assets; now
        # its failure leaves a draft, which that check either completes or
        # withdraws.
        continue-on-error: true

      # ★ Attach every asset, then verify the RELEASE carries them. This is a
      # different claim from the artifact gate above, which reads the directory
      # the build runners produced: that step says the files EXIST and are
      # complete for every platform, this one says they ARRIVED. Every release
      # that shipped hollow passed the first and failed the second.
      #
      # The refill is one file at a time rather than another concurrent batch,
      # because the batch is what hid the loss: a single rejection ends a batch
      # and the remaining failures are never reported at all. Each refill is also
      # bounded, since gh's uploader has no timeout anywhere and a stalled
      # connection would otherwise hold this step until the job's own limit: a
      # hang is not a failure anything downstream can act on.
      #
      # The expected set is read from the downloaded artifacts rather than
      # restated here, so a target added to electron-builder.yml is carried by
      # this check the day it is added, exactly as the artifact gate above does.
      - name: Attach and verify every asset
        id: attach
        # A cap on the whole step, set so the verification at its end is always
        # reachable: three passes over a handful of stragglers, each refill
        # bounded, fits well inside it even when the upload path is crawling.
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACTS: artifacts
          TAG: v${{ needs.version.outputs.version }}
        run: |
          set -uo pipefail

          work="$(mktemp -d)"
          expected="$work/expected.txt"
          actual="$work/actual.txt"
          todo="$work/todo.txt"

          # Basenames only: the download flattens each platform's artifact into
          # its own directory, and a release asset is addressed by its file name.
          find "$ARTIFACTS" -type f -exec basename {} \; | LC_ALL=C sort > "$expected"
          total="$(wc -l < "$expected" | tr -d ' ')"
          if [ "$total" -eq 0 ]; then
            echo "::error::no files under $ARTIFACTS, so this release cannot be complete"
            exit 1
          fi
          echo "this release must carry $total asset(s)"

          # The draft has to be there. It is missing when the step above could not
          # create it at all, and every refill below would then fail one file at a
          # time instead of saying so once.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$TAG has no release to attach to, so nothing can be verified"
            exit 1
          fi

          # Only an asset GitHub has finished storing counts. A name present in
          # any other state is not a download anyone can complete.
          uploaded_names() {
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[] | select(.state == "uploaded") | .name' \
              | LC_ALL=C sort
          }

          # A refill with a time limit, so one stalled upload cannot hold a pass
          # open: gh's uploader has no timeout of its own, and a hang is not a
          # failure anything downstream can act on.
          upload_bounded() {
            if command -v timeout >/dev/null 2>&1; then
              timeout 300 gh release upload "$TAG" "$1" --repo "$GITHUB_REPOSITORY" --clobber
            else
              gh release upload "$TAG" "$1" --repo "$GITHUB_REPOSITORY" --clobber
            fi
          }

          # Three passes, each attaching whatever is still missing. A pass with
          # nothing to do ends the loop, so a release that uploaded cleanly pays
          # one API call and no wait.
          for pass in 1 2 3; do
            uploaded_names > "$actual"
            comm -23 "$expected" "$actual" > "$todo"
            if [ ! -s "$todo" ]; then
              echo "pass $pass: every asset is attached"
              break
            fi
            echo "pass $pass: $(wc -l < "$todo" | tr -d ' ') asset(s) to attach"
            while IFS= read -r name; do
              matches="$(find "$ARTIFACTS" -type f -name "$name")"
              file="${matches%%$'\n'*}"
              if [ -z "$file" ]; then
                echo "::error::$name is expected but is not in $ARTIFACTS"
                continue
              fi
              # --clobber because a pass may be replacing an attempt GitHub
              # registered but never finished, which is not downloadable either.
              if upload_bounded "$file"; then
                echo "attached $name"
              else
                echo "::warning::pass $pass could not attach $name, so it is retried"
              fi
            done < "$todo"
            if [ "$pass" -lt 3 ]; then sleep $((pass * 10)); fi
          done

          # ★ The claim this step exists for: nothing is published unless the
          # release is whole. An incomplete set fails the run here, and the step
          # below withdraws the draft, so no half-release survives to be
          # resolved by anyone's updater.
          uploaded_names > "$actual"
          comm -23 "$expected" "$actual" > "$todo"
          if [ -s "$todo" ]; then
            echo "::error::INCOMPLETE: $TAG is missing $(wc -l < "$todo" | tr -d ' ') of $total asset(s)"
            while IFS= read -r name; do echo "  missing: $name"; done < "$todo"
            echo "  attached: $(wc -l < "$actual" | tr -d ' ') of $total"
            exit 1
          fi
          echo "COMPLETE: $TAG carries all $total asset(s)"
          while IFS= read -r name; do echo "  $name"; done < "$actual"

      # ★ Reachable only when something above failed or the run was cancelled,
      # and at that moment the release is still a draft, because publishing is
      # the step below. Withdrawing a draft is invisible to every client: no
      # half-release is left in the feed for an updater to resolve, and no
      # download is left hanging at 0%.
      #
      # A PUBLISHED release is deliberately left alone, with the run still
      # failing loudly: it is already resolvable by clients, so withdrawing it
      # would be the more harmful act, and leaving it is the least harmful
      # option when a rerun can still refill it.
      #
      # A step-level status function, not a job-level one. The job's own `if`
      # above still takes none, so a red build leg or a refused platform gate
      # still skips this job entirely rather than reaching any of these steps.
      - name: Withdraw a release that is not complete
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          set -uo pipefail
          echo "::error::$TAG is not going out: this run did not attach and verify its whole asset set"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "there is no release for $TAG to withdraw"
            exit 0
          fi
          draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
          if [ "$draft" != 'true' ]; then
            echo "::warning::$TAG is already published, so it is left in place for a rerun to refill rather than withdrawn"
            exit 0
          fi
          # No --cleanup-tag: a draft has no tag ref, and this workflow creates
          # the tag when it publishes, not before.
          if gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes; then
            echo "withdrew the draft for $TAG, so no partial release is left behind"
          else
            echo "::error::could not withdraw the draft for $TAG; nothing was published, but a draft may remain for a rerun to reuse"
          fi

      # ★ The iOS availability marker: a line in the release body, written ONLY
      # when the mobile pipeline produced an installable TestFlight build for this
      # commit. The phone reads releases.atom, which carries the release body as an
      # entry's <content> but carries no assets, so a body line is the one signal
      # the phone can read off the same release the desktop published. The reader
      # (core/feed.js, mobile/Claw/UpdateFeed.swift) offers a release to the phone
      # only when its entry carries this line, so a desktop-only or .github-only
      # commit, which produces a release but NO mobile run, is invisible to the
      # phone's "update available". That is the phantom-update bug: measured
      # 2026-09-18, v1.0.1-dev.279.9a58115cb1 (a .github-only change, PR #39) had
      # no mobile run and was not on TestFlight, yet the banner offered it.
      #
      # ★ Why HERE and not in the mobile pipeline: the mobile release job finishes
      # its VALID wait BEFORE this job publishes (the platforms gate above makes
      # the desktop publish wait on the mobile ^release^ job), so at that moment
      # there is no published release for the mobile job to stamp. This job, at
      # publish time, is the first place a release exists AND its iOS verdict is
      # known. It reads that verdict the same way platforms-gate.yml does: the
      # mobile run for this commit, and whether its ^release^ job concluded
      # success. A commit with no mobile run (desktop-only, .github-only) has no
      # such job, so no marker, which is exactly the intended outcome.
      #
      # The marker string has one owner, core/release.js (iosMarkerLine()), so the
      # writer here and the two readers cannot drift. The line is appended to the
      # generated notes rather than replacing them, and only when the verdict is a
      # green mobile release; anything else (no run, a red or absent release job)
      # leaves the body unmarked and the release invisible to the phone.
      - name: Mark iOS availability when TestFlight is ready
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: v${{ needs.version.outputs.version }}
          MOBILE_PIPELINE: claw-mobile pipeline
        run: |
          set -eo pipefail

          # The marker line, from its one owner, so this step cannot spell it a
          # different way from the readers.
          # ★ The program is SINGLE quoted and carries no backslashes, and both
          # halves of that matter. Escaped quotes inside a single-quoted shell
          # argument survive VERBATIM, so this line used to hand node
          # `import(\"./core/release.js\")` and die with "Expected unicode escape"
          # at eval, one step before publishing. Measured 2026-09-18 on
          # v1.0.1-dev.282.3dda142f49: the release job failed here, the draft was
          # never published, and no release went out at all. The command itself
          # is correct and needs no escaping, which is why the stray backslashes
          # were invisible in review. desktop/test/release-trigger.test.js now
          # asserts no workflow passes a backslash inside a single-quoted
          # `node -e` program.
          marker="$(node -e 'import("./core/release.js").then(m => process.stdout.write(m.iosMarkerLine()))')"
          if [ -z "$marker" ]; then
            echo "::error::core/release.js produced no iOS marker line, so the phone could never be offered any release"
            exit 1
          fi

          # The mobile pipeline's run for this exact commit, newest first. A
          # commit that does not build the phone (desktop-only, .github-only) has
          # no such run at all, which is a real answer: the release stays unmarked
          # and the phone does not offer it.
          run_id="$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
            --jq "[.workflow_runs[] | select(.name == \"$MOBILE_PIPELINE\")] | sort_by(.created_at) | reverse | .[0].id // empty")"

          if [ -z "$run_id" ]; then
            echo "::notice::no $MOBILE_PIPELINE run for $SHA, so this commit built no TestFlight build; the release is left unmarked and the phone will not offer it."
            exit 0
          fi

          # Whether that run's release job (the TestFlight upload and the wait for
          # VALID) concluded success. That job is named 'release' in the mobile
          # pipeline; the platforms gate above has already refused to publish if
          # it was red, so by this line it is either success or does not exist.
          release_result="$(gh api "repos/$REPO/actions/runs/$run_id/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name == "release")] | .[0].conclusion // empty')"

          if [ "$release_result" != 'success' ]; then
            echo "::notice::$MOBILE_PIPELINE ran for $SHA but its release job is not success (it is '$release_result' or absent), so no installable TestFlight build was produced; the release is left unmarked."
            exit 0
          fi

          # There is an installable TestFlight build. Append the marker to the
          # release body, once: read the current body, and add the line only if
          # it is not already there (a rerun against an already-marked release
          # must not stack it).
          body="$(gh release view "$TAG" --repo "$REPO" --json body --jq '.body // ""')"
          if printf '%s' "$body" | grep -qF "$marker"; then
            echo "the release already carries the iOS marker"
            exit 0
          fi

          printf '%s\n\n%s\n' "$body" "$marker" > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --repo "$REPO" --notes-file "$RUNNER_TEMP/notes.md"

          # Read it back: the marker must actually be in the body the phone will
          # read, not merely have been sent.
          after="$(gh release view "$TAG" --repo "$REPO" --json body --jq '.body // ""')"
          if printf '%s' "$after" | grep -qF "$marker"; then
            echo "marked $TAG as iOS-available: an installable TestFlight build exists for $SHA"
          else
            echo "::error::the iOS marker did not stick to $TAG, so the phone would not be offered this release even though its TestFlight build is valid"
            exit 1
          fi

      # ★ Publication, last, and the only step that creates the tag. Every claim
      # about the asset set has already been made by the step above, and a run
      # that could not make them failed instead of reaching this line.
      - name: Publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.tagged != 'true' }}
        run: |
          set -eo pipefail
          args=(--draft=false)
          if [ "$PRERELEASE" = 'true' ]; then args+=(--prerelease); fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" "${args[@]}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,url,assets \
            --jq '"published \(.tagName) draft=\(.isDraft) prerelease=\(.isPrerelease) assets=\(.assets|length)"'

      # A prerelease per merge accumulates fast, and each carries four installers,
      # so this keeps the newest 10 and deletes the rest along with their tags.
      #
      # The filter is deliberately narrow, prerelease AND a `-dev.` identifier in
      # the tag, because this deletes published releases: a stable release, or a
      # hand-made prerelease that is not one of ours, must never be reachable by
      # it. The run that just published is the newest, so it is always kept.
      - name: Prune old dev releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("-dev\\.")))]
                  | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' > stale.txt

          pruned=0
          while IFS= read -r tag; do
            if [ -z "$tag" ]; then continue; fi
            echo "deleting $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            pruned=$((pruned + 1))
          done < stale.txt
          echo "pruned $pruned dev release(s); newest 10 kept"
