name: claw-mobile pipeline

# The whole mobile pipeline in one file: version, test, release.
#
# There is no publish step for the app's update banner: the banner reads the
# repository's GitHub Releases directly (core/feed.js, mobile/Claw/UpdateFeed.swift
# read releases.atom), and a release already exists per build, so there is
# nothing to publish beside it. The desktop reads the same releases through
# electron-updater. This replaced a hand-published GitHub Pages appcast that was
# a second copy of the same truth and needed Pages enabled to go green.
#
# It replaced two files that each owned half of it, mobile.yml (compile and
# test) and mobile-release.yml (sign and upload). The split was not merely
# untidy: the two ran in PARALLEL on the same push, so the release could archive,
# sign and upload a build to TestFlight while the iOS matrix testing that same
# commit was still failing. A surface with two owners has no owner, and this one
# could ship past its own tests.
#
# One file, and one gate: `release` needs the test matrix, so a red leg can no
# longer produce a TestFlight build. The legs still run on a pull request, where
# nothing is signed and nothing is uploaded.
#
# ★ That gate covers this pipeline's own matrix. The whole matrix is the other
# half, and it is the `platforms` job below: the desktop release is built and
# tested by a different workflow, and on 2026-09-16 the desktop release published
# for a commit whose mobile pipeline was red because neither file could see the
# other. Publication now waits on both, in both directions. `platforms-gate.yml`
# owns what is waited on; `CONVENTIONS.md` in this directory owns the rule and
# where to look when a release did not happen.
#
# Three ways in, and they mean the same thing here:
#
#   push to main       whatever just landed in mobile/ or core/ is tested, then
#                      uploaded as a dev build for internal TestFlight testing.
#   pull_request       the same paths, tested only. No Apple credential is
#                      needed and no release job runs.
#   tag `v*`           a release. The tag must equal package.json, checked
#                      before anything is built, and the same upload runs with
#                      the build available to external testing as well.
#   workflow_dispatch  a dev build of any ref, on demand.
#
# TestFlight is the channel for BOTH kinds of build, which is Abi's decision, and
# the reason a dev build here is a real distribution build rather than an ad-hoc
# or development-signed one: the only difference between the two kinds of run is
# the version they carry and whether the resulting build may leave internal
# testing. Nothing about how it is signed or uploaded changes.
#
# `paths` names what this workflow depends on rather than what it ignores, and
# `core/**` is the non-obvious entry: the client compiles the shared library in,
# so a change confined to core/ produces a different app while leaving the
# desktop alone, and a filter of `mobile/**` alone would skip exactly that run.
# No docs or config path appears here, because none of them can change what
# compiles. GitHub does not evaluate path filters for tag pushes, so a release
# can never be skipped by one.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'mobile/**'
      - 'core/**'
      # A workflow that cannot run on its own change is one nobody can fix.
      - '.github/workflows/mobile-pipeline.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'core/**'
      - '.github/workflows/mobile-pipeline.yml'
  workflow_dispatch:

# Pushing three commits in a minute should test and upload the last one, not all
# three. Tag builds are exempt: a release run must never be cancelled by
# anything. One group covers both halves now that they are one pipeline, which
# is stricter than the two groups were separately: a superseded run is cancelled
# before its upload rather than during one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Runs once, on the cheapest runner, before the build. It settles what version
  # this build carries and whether it should happen at all, and the answer is
  # Apple's problem as much as ours: a bundle version has to be three integers
  # and a monotonically increasing build number, or the upload is rejected after
  # the archive has already been paid for.
  #
  # Skipped on a pull request. A version names a build that is going to ship, and
  # a pull request ships nothing; the release job reads this job's output as part
  # of its condition, and an output that was never produced reads as no build,
  # which is the correct answer there.
  version:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    outputs:
      # The app's full identity, `X.Y.Z-dev.<count>.<sha>` for a dev build.
      # This is what the app reports internally and what its update banner will
      # compare against a feed, and it cannot be the bundle version because a
      # bundle version may only be three integers.
      version: ${{ steps.decide.outputs.version }}
      # The first three of those, which IS the bundle version Apple accepts.
      marketing: ${{ steps.decide.outputs.marketing }}
      # The commit count, which IS the monotonically increasing integer Apple
      # accepts as CFBundleVersion. It is already the leading orderable part of
      # the dev version, so the two are one number rather than two that can
      # disagree.
      build-number: ${{ steps.decide.outputs.count }}
      build: ${{ steps.decide.outputs.build }}
      tagged: ${{ steps.decide.outputs.tagged }}
    steps:
      # Full history, because both halves of the version depend on it: the count
      # is `git rev-list --count HEAD` and a release build is recognised by the
      # tag on HEAD. A shallow checkout yields no count, which the check after
      # the next step treats as a failure rather than a version.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # desktop/scripts/build-version.js already owns "what version is this
      # build" for local builds and CI: the dev form, the tag check against
      # package.json, and the stand-down when a commit is covered by its own tag
      # build. Reused rather than reimplemented so the phone and the desktop
      # cannot disagree about what the next version is, and so there is one
      # place to change if the scheme ever moves. It appends version, build and
      # tagged to $GITHUB_OUTPUT itself, and `count` alongside them.
      - name: Decide the version
        id: decide
        run: |
          set -eo pipefail
          node scripts/build-version.js

          # Read back out of the output file the script just wrote, rather than
          # deriving the same numbers a second time here: the bundle version
          # must be the count the dev version was named from, not a count that
          # happens to agree with it.
          version="$(sed -n 's/^version=//p' "$GITHUB_OUTPUT" | tail -1)"
          count="$(sed -n 's/^count=//p' "$GITHUB_OUTPUT" | tail -1)"

          # No count means a shallow checkout, and then every build would carry
          # the same bundle version, which Apple accepts once and rejects after
          # that. An empty CFBundleVersion is rejected too, so this stops rather
          # than producing either.
          if [ -z "$count" ]; then
            echo "::error::no commit count, so there is no bundle version to derive. The checkout must be full history (fetch-depth: 0)."
            exit 1
          fi

          # The three-integer form Apple requires: everything before the
          # prerelease, and the prerelease is the only thing stripped.
          marketing="${version%%-*}"
          if ! printf '%s' "$marketing" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$version does not start with three dot separated integers, so Apple would reject it"
            exit 1
          fi

          echo "marketing=$marketing" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "bundle version will be $marketing ($count)"

  # ★ The whole matrix, not just this platform, before anything is uploaded.
  #
  # This job is what makes a TestFlight upload wait on the DESKTOP pipeline, the
  # same way `release.yml`'s copy makes a desktop release wait on this one. It
  # runs beside `test` rather than after it, so the wait overlaps the iOS matrix
  # instead of following it.
  #
  # A pull request ships nothing, so there is nothing to gate; and a tag stands
  # the build down through the version job, the same condition `release` uses.
  platforms:
    name: every platform must be green
    needs: version
    if: github.event_name != 'pull_request' && needs.version.outputs.build == 'true'
    permissions:
      actions: read
    uses: ./.github/workflows/platforms-gate.yml
    with:
      # The other pipeline, by the name GitHub's run list reports it under, and
      # the jobs that are its builds and tests: one `build` leg per platform,
      # each of which runs the desktop suite before it packages. Its release job
      # is deliberately not named here, because it waits on this workflow in
      # turn.
      platform: claw-desktop release
      verdict: '^build'

  # ★ SwiftLint, the mobile platform's half of the root lint. It runs once, on
  # the oldest stable image, and it is the peer of the JS import lint in
  # release.yml: mobile lints with its own tool through its own config
  # (mobile/.swiftlint.yml), the way core and desktop lint with ESLint, so no
  # platform's lint is bolted onto another's job.
  #
  # Why a separate job rather than a step in the test matrix: the matrix is one
  # leg per iOS version, and a style finding is a property of the source rather
  # than of the SDK, so running it twice would only report the same thing twice.
  #
  # --strict makes every finding fatal, the same posture the root eslint run
  # takes. The config is clean on the current tree by construction (the rules the
  # codebase deliberately does not follow are off in that file, each with its
  # reason), so a finding here is a new one.
  #
  # It runs on every trigger including a pull request, because a lint failure on
  # a change is worth seeing there; the release job below does not gate on it for
  # a pull request (it does not run at all there), but on a push it does.
  lint:
    name: swiftlint
    runs-on: macos-26
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # SwiftLint is not part of Xcode and the image may or may not carry it.
      # HOMEBREW_NO_AUTO_UPDATE keeps the install from spending a minute updating
      # the tap index for one formula, the same discipline the xcodegen install
      # below uses.
      - name: Install SwiftLint
        run: |
          set -eo pipefail
          if ! command -v swiftlint >/dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install swiftlint
          fi
          swiftlint version

      # --strict: any finding is a failure, the CI equivalent of the eslint run
      # in release.yml. The report is verbose by default, which is what makes a
      # failure readable in the log.
      - name: Lint the Swift sources
        run: swiftlint lint --strict

  # The compile-and-test half, one leg per iOS version. Credential-free by
  # design: nothing here needs the Apple account and nothing here signs
  # anything, which is what keeps the test legs runnable on a pull request from
  # a fork.
  #
  # One leg per version, rather than one job pinned to one image, because the
  # image is what supplies the SDK. macos-26 ships Xcode 26 and the iOS 26.x
  # runtimes and no iOS 27 runtime at all; iOS 27 arrives with Xcode 27 on the
  # `xcode-27` image, which GitHub publishes as a public preview outside its SLA.
  # A job pinned to one image cannot express both, and the failure would be a
  # confusing missing-simulator error on one leg rather than anything naming the
  # SDK as the cause.
  #
  # That SLA exception is accepted deliberately and only for the leg that cannot
  # exist without it: iOS 27 has no stable image yet, and testing against an
  # unreleased-but-shipping iOS is the point of this matrix rather than an
  # accident of it. The iOS 26 leg stays on the SLA-covered image.
  #
  # The versions are majors rather than exact releases on purpose. Simulator
  # runtimes are pinned to whatever the image carries, the resolver below takes
  # the newest minor inside the major, and an image roll moving 26.4 to 26.5
  # should not turn this file red.
  test:
    strategy:
      # One version failing must not cancel the others, which is the default and
      # is wrong here: a cancelled leg reads as a run that never finished, and
      # the whole point of the matrix is to learn which versions break. It also
      # matters for the gate, because a cancelled leg is not a passing one.
      fail-fast: false
      matrix:
        include:
          - ios: 26
            runner: macos-26
          - ios: 27
            runner: xcode-27
    # Named so the run list says which version a leg is, rather than the default
    # expansion of every matrix key including the image.
    name: iOS ${{ matrix.ios }}
    # The image is named in the matrix rather than `macos-latest`, so the
    # platform each leg runs on is a property of the file rather than of
    # whatever the alias resolves to that week.
    runs-on: ${{ matrix.runner }}
    # Every xcodebuild step runs in mobile/, where project.yml and the generated
    # project live. Paths on steps that do not care are unaffected.
    defaults:
      run:
        working-directory: mobile
    # A hung simulator boot would otherwise hold a runner until GitHub kills the
    # job at its much longer ceiling.
    timeout-minutes: 40
    steps:
      # Left to resolve its own ref. Each leg has its own checkout, and for a
      # pull_request the default is already the merge commit this gate is
      # supposed to judge.
      - uses: actions/checkout@v4

      # Which Xcode is used is chosen here rather than left to the image's
      # default, and the newest installed one wins.
      #
      # This deliberately does NOT pin a version, and that is a correction. An
      # earlier revision required Xcode 27 by name, on the belief that macos-26
      # carried it. The first real run proved otherwise: this image ships 26.0.1
      # through 26.6, and Xcode 27 lives on the separate `xcode-27` preview
      # image. Pinning a version the runner does not have fails every run, and
      # pinning one it does have fails the day GitHub rolls the image forward.
      #
      # The requirement that is actually true is a floor: Swift 6 language mode
      # (SWIFT_VERSION 6.0 in project.yml) needs the Xcode 16 toolchain or
      # newer. That is what gets checked.
      #
      # The version is read back out of each bundle rather than matched by
      # filename, because the bundle name is not stable. This repo's own
      # development machine has it at /Applications/Xcode-27.0.0.app, while the
      # runner has /Applications/Xcode_26.6.app alongside an unversioned
      # /Applications/Xcode.app pointing at the same build.
      - name: Select Xcode
        run: |
          set -eo pipefail

          # ★ Each bundle's version is READ rather than asked of the toolchain.
          # This loop used to run `xcodebuild -version` against every bundle in
          # /Applications, and every one of those calls spawns the toolchain:
          # measured 2026-09-17, the iOS 26 leg printed its chosen version 28 s
          # into the step, once per bundle the image carries (macos-26 has
          # 26.0.1 through 26.6). `Contents/version.plist` carries the same
          # CFBundleShortVersionString that `xcodebuild -version` prints as
          # "Xcode <version>", and reading it is a file read, not a process. The
          # chosen bundle is still asked below, so the toolchain is proved to
          # work, and a bundle whose plist cannot be read falls back to the old
          # call rather than being skipped.
          #
          # The choice is unchanged: the newest bundle wins, and the floor of
          # Xcode 16 for Swift 6 language mode still refuses anything older.
          chosen_line="$(
            for bundle in /Applications/Xcode*.app; do
              [ -d "$bundle" ] || continue
              version="$(plutil -extract CFBundleShortVersionString raw -o - "$bundle/Contents/version.plist" 2>/dev/null || true)"
              if [ -z "$version" ]; then
                version="$(DEVELOPER_DIR="$bundle/Contents/Developer" xcodebuild -version 2>/dev/null | head -1 | sed 's/^Xcode //' || true)"
              fi
              [ -n "$version" ] || continue
              printf '%s %s\n' "$version" "$bundle"
            done | sort -V | tail -1
          )"

          if [ -z "$chosen_line" ]; then
            echo "::error::no usable Xcode found under /Applications"
            ls -d /Applications/Xcode*.app 2>/dev/null || echo "no Xcode bundles at all"
            exit 1
          fi

          version="${chosen_line%% *}"
          bundle="${chosen_line#* }"
          major="${version%%.*}"

          if [ "$major" -lt 16 ]; then
            echo "::error::newest Xcode is $version, and the project needs the Xcode 16 toolchain or newer for Swift 6 language mode"
            exit 1
          fi

          chosen="$bundle/Contents/Developer"

          # DEVELOPER_DIR is exported for every later step rather than used for
          # this one only. It is what xcodebuild, xcrun and simctl all read, so
          # the simulator list below comes from the same toolchain that builds.
          echo "DEVELOPER_DIR=$chosen" >> "$GITHUB_ENV"
          echo "using $bundle (Xcode $version)"
          "$chosen/usr/bin/xcodebuild" -version
          xcrun simctl list runtimes

      # xcodegen is not part of Xcode and the image may or may not carry it.
      # HOMEBREW_NO_AUTO_UPDATE keeps the install from spending a minute
      # updating the tap index for one formula.
      - name: Install xcodegen
        run: |
          set -eo pipefail
          if ! command -v xcodegen >/dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version

      # Claw.xcodeproj is generated, not committed: mobile/project.yml is the
      # single source of truth for the project's shape and the .gitignore says
      # so. The checkout therefore has no project in it at all, and this step is
      # what makes the next two possible.
      #
      # Generated here rather than carried in from another job on purpose. It is
      # the one thing every job in this pipeline produces identically from the
      # same source, so it looks like a saving, and it is not one: the generator
      # is whatever brew installed on that image, the file is a few lines of
      # text, and passing it around would buy seconds while adding a stage that
      # must finish before any other job can start.
      - name: Generate the Xcode project
        run: xcodegen generate

      # Gate 1, compile. Building for the simulator rather than for a device is
      # what keeps this free of Apple credentials, and the generic destination
      # compiles every target in the scheme without picking a simulator yet.
      #
      # `build-for-testing` rather than `build`, so the test bundle is compiled
      # by this step too. That is what lets the whole leg compile ONCE: this
      # produces the app and the test bundle together, and the test step below
      # runs exactly these products with `test-without-building`. Previously
      # this gate ran `build` and the test step ran `test`, which compiled the
      # app twice in the same leg for no extra coverage, and a fault in the test
      # bundle was only ever found by the second of the two compiles.
      #
      # The release gate lives in Python (scripts/asc.py), so its guard runs here
      # in the credential-free test half rather than only in the release job. It
      # proves that a build which never reaches VALID fails the wait rather than
      # letting the release publish something still in Processing. No Apple round
      # trip: the test stubs the API.
      - name: Test the release gate (asc)
        run: python3 scripts/asc_test.py

      # The derived data path is pinned so the two steps share one product tree
      # instead of each getting a private one, which is what makes the second
      # step a reuse rather than a rebuild.
      - name: Build for the simulator
        run: |
          set -eo pipefail
          derived="$RUNNER_TEMP/DerivedData"
          echo "DERIVED_DATA=$derived" >> "$GITHUB_ENV"

          xcodebuild \
            -project Claw.xcodeproj \
            -scheme Claw \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$derived" \
            build-for-testing

      # ★ The boot is deliberately NOT started before the compile, and that is a
      # measurement rather than a preference. Tried on 2026-09-17 and reverted
      # the same day: `simctl boot` was kicked off underneath the build so the
      # first boot would not be paid after it, and the boot turned out to be
      # CPU-bound rather than idle, so the compile absorbed all of it and more.
      # On run 35275131733 "Build for the simulator" went from 31 s to 3 m 55 s
      # on the iOS 27 leg and from 58 s to over 4 m 41 s on the iOS 26 leg,
      # where the boot itself is worth about two to three minutes inside the
      # test step, so the leg ends up no shorter. Two jobs on one small runner
      # contend for the same cores. Paying the boot serially is what these
      # numbers support; overlapping it would need a runner with cores to spare,
      # which is a cost decision rather than a workflow one.
      # The simulator is resolved from the runner's own list rather than named.
      # The image's simulator set differs from any given development machine's,
      # so a hardcoded name is the classic way this job fails: it is present
      # locally and absent there, and the failure reads as a bad destination
      # rather than a bad assumption. iPhone only, because the project targets
      # iPhone (TARGETED_DEVICE_FAMILY is 1).
      #
      # It is resolved against THIS MATRIX ENTRY's version, and that is a
      # correction rather than a tidy-up. Taking the newest runtime on the box
      # would let the iOS 26 leg pick up an iOS 27 simulator the moment one
      # appears on macos-26, so the leg would go on passing while testing a
      # version it was never asked to test. The runtime's major version must
      # equal the entry's, and the newest minor inside that major wins, which
      # is the only part left free to drift with the image.
      #
      # No runtime of that major is a loud failure naming the version. The leg
      # genuinely cannot verify that version, and falling back to another major
      # would be exactly the silent wrong-version pass this check exists to
      # prevent.
      #
      # The JSON form of the same command is used because it is the one that can
      # be parsed without guessing at column widths.
      - name: Resolve an available iPhone simulator
        env:
          IOS_MAJOR: ${{ matrix.ios }}
        run: |
          set -eo pipefail

          sim="$(xcrun simctl list devices available --json | python3 -c '
          import json, os, re, sys
          wanted = int(os.environ["IOS_MAJOR"])
          devices = json.load(sys.stdin)["devices"]
          best = None
          for identifier, entries in devices.items():
              match = re.search(r"SimRuntime\.iOS-([0-9-]+)$", identifier)
              if not match:
                  continue
              version = tuple(int(part) for part in match.group(1).split("-"))
              if version[0] != wanted:
                  continue
              for device in entries:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      if best is None or version > best[0]:
                          best = (version, device["udid"])
                      break
          if best is None:
              sys.exit(1)
          print(best[1])
          ' || true)"

          if [ -z "$sim" ]; then
            echo "::error::no available iPhone simulator on iOS $IOS_MAJOR on this runner, so the iOS $IOS_MAJOR leg has nothing to verify against. Runtimes this image does carry:"
            xcrun simctl list runtimes || true
            xcrun simctl list devices available || true
            exit 1
          fi

          echo "SIMULATOR_UDID=$sim" >> "$GITHUB_ENV"
          echo "resolved simulator for iOS $IOS_MAJOR:"
          xcrun simctl list devices available | grep -F "$sim" || true

      # Gate 2, the real verification: unit tests plus the parity suites, which
      # are the ones that compare the client's behaviour against core rather
      # than against itself.
      #
      # `test-without-building` runs the products the compile gate above already
      # made, in that step's derived data, rather than compiling the app a second
      # time. What is tested is therefore what compiled, and a rebuild that could
      # disagree with the compile gate's product does not exist.
      #
      # A GUI boot check is deliberately not attempted here. desktop/scripts/
      # smoke.js is the strongest check the desktop app has, and it cannot run
      # on GitHub's macOS runners (measured: no output, 30s timeout), so a
      # launch gate would fail for a reason that has nothing to do with the
      # code. That is why this gate is build plus tests and stops there.
      - name: Test on the resolved simulator
        run: |
          set -eo pipefail

          xcodebuild \
            -project Claw.xcodeproj \
            -scheme Claw \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            test-without-building

  # The publish half: the iOS client, built for a real device, signed with the
  # account's distribution certificate, and uploaded to TestFlight.
  #
  # ★ The gate. `needs: [version, test, platforms]` is what makes a red test leg
  # unable to produce a TestFlight build, and it is stated twice on purpose: the
  # dependency orders this job behind the matrix, and the condition asserts the
  # matrix's result itself. A job-level `if` is not ANDed with the implicit
  # success() check, so a job that carries one can run after the jobs it needs
  # have failed unless it says otherwise (that is the documented use of a status
  # function there). This condition is here regardless, to stand a tag build
  # down, so the test result is asserted in it explicitly rather than inherited
  # by accident.
  #
  # `platforms` is the other half of the same claim, and the half that was
  # missing until 2026-09-16: this pipeline's matrix says the phone is tested,
  # and that job says the DESKTOP is, for this commit, before an upload leaves
  # here. Asserted the same way, for the same reason.
  #
  # `github.event_name != 'pull_request'` is the other half of the same idea: a
  # pull request tests the merge commit and ships nothing, on any ref, however
  # green it is.
  #
  # What is NOT shared with the legs above, and cannot be: they build for the
  # SIMULATOR, this job builds a device ARCHIVE. They are different artifacts
  # from different SDKs, a device archive cannot run the unit tests, and a
  # simulator product cannot be signed or uploaded. Nothing crosses this job
  # boundary as an artifact, so nothing is carried across it with
  # upload-artifact; the sharing that is real is inside the job, where the one
  # archive is verified, exported and uploaded without being rebuilt.
  release:
    needs: [version, lint, test, platforms]
    if: github.event_name != 'pull_request' && needs.version.outputs.build == 'true' && needs.lint.result == 'success' && needs.test.result == 'success' && needs.platforms.result == 'success'
    # Named rather than `macos-latest`, the same discipline the test matrix uses,
    # so the toolchain is a property of this file. macos-26 carries Xcode 26,
    # which is the oldest toolchain that can build the iOS 26 deployment target
    # project.yml declares.
    runs-on: macos-26
    # Every xcodebuild step runs in mobile/, where project.yml and the generated
    # project live.
    defaults:
      run:
        working-directory: mobile
    # Archive, export and upload are minutes; the wait for the build to appear
    # in App Store Connect is up to fifteen more. This ceiling is well clear of
    # all of it, and bounded so a stuck upload cannot hold a runner.
    timeout-minutes: 60
    steps:
      # Pinned to the commit this run was triggered for, so the version the
      # archive is stamped with names the code that is in it. The version job
      # reads the same sha, which is what makes the two agree.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # The newest Xcode the runner has, with a floor of 16 for Swift 6 language
      # mode. Identical to the selection in the test legs above, including the
      # reason it is not pinned: pinning a version the image does not carry
      # fails every run, and pinning one it does carry fails the day the image
      # rolls forward.
      - name: Select Xcode
        run: |
          set -eo pipefail

          # Same selection as the test legs above, including the reason it is a
          # file read rather than a toolchain call per bundle: measured
          # 2026-09-17, this step cost 18 s here and 28 s on a test leg, once per
          # Xcode bundle the image carries. `Contents/version.plist` carries the
          # version `xcodebuild -version` would print, the chosen bundle is
          # still asked below so the toolchain is proved, and a bundle whose
          # plist cannot be read falls back to the old call.
          chosen_line="$(
            for bundle in /Applications/Xcode*.app; do
              [ -d "$bundle" ] || continue
              version="$(plutil -extract CFBundleShortVersionString raw -o - "$bundle/Contents/version.plist" 2>/dev/null || true)"
              if [ -z "$version" ]; then
                version="$(DEVELOPER_DIR="$bundle/Contents/Developer" xcodebuild -version 2>/dev/null | head -1 | sed 's/^Xcode //' || true)"
              fi
              [ -n "$version" ] || continue
              printf '%s %s\n' "$version" "$bundle"
            done | sort -V | tail -1
          )"

          if [ -z "$chosen_line" ]; then
            echo "::error::no usable Xcode found under /Applications"
            exit 1
          fi

          version="${chosen_line%% *}"
          bundle="${chosen_line#* }"
          if [ "${version%%.*}" -lt 16 ]; then
            echo "::error::newest Xcode is $version, and the project needs the Xcode 16 toolchain or newer for Swift 6 language mode"
            exit 1
          fi

          echo "DEVELOPER_DIR=$bundle/Contents/Developer" >> "$GITHUB_ENV"
          echo "using $bundle (Xcode $version)"
          "$bundle/Contents/Developer/usr/bin/xcodebuild" -version

      # The project is generated output, not source, and the checkout has no
      # Claw.xcodeproj in it at all. Regenerating here means a stale copy can
      # never be what gets signed and uploaded.
      - name: Install xcodegen
        run: |
          set -eo pipefail
          if ! command -v xcodegen >/dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version

      - name: Generate the Xcode project
        run: xcodegen generate

      # The App Store Connect key, written to a file because every consumer of
      # it takes a path, and with a restrictive mode because it is a private
      # key: the same shape release.yml uses for its notarization key.
      #
      # The path is exported rather than the value, so the key itself never
      # appears in a later step's environment or in the argument list of
      # anything. The two identifiers that DO travel on a command line
      # (ASC_KEY_ID and ASC_ISSUER_ID) are not credentials: they name the key
      # and the account, and both are visible in the App Store Connect UI. The
      # file is removed by the last step of this job, which runs even when an
      # earlier one fails.
      - name: Install the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -eo pipefail
          if [ -z "$ASC_KEY_P8" ]; then
            echo "::error::ASC_KEY_P8 is not set. This workflow cannot build anything without the App Store Connect key: set ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 as repository secrets."
            exit 1
          fi
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_KEY_P8" > "$key"
          chmod 600 "$key"
          ls -l "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      # The Apple Distribution identity, imported once into a keychain of this
      # run's own. It is the one part cloud managed signing cannot supply and a
      # human had to make: Apple refuses to create a Distribution certificate
      # or an App Store profile through the API (a plain 403 for both, whatever
      # the key's role), so the certificate is created in Xcode, exported with
      # its private key as a .p12, and its bytes and password kept as the two
      # repo secrets read here.
      #
      # Why it exists at all: without an identity already in the account,
      # `-allowProvisioningUpdates` mints a throwaway one on every archive and
      # never revokes it, until the account hits Apple's certificate cap and the
      # next archive fails for the want of a free slot. A stable identity in the
      # keychain is the one signing already knows to reuse, so nothing is minted
      # and nothing accumulates.
      #
      # A dedicated keychain, deleted with the runner, so this never touches a
      # login keychain and the private key never outlives the job. The identity
      # is not printed and the password reaches `security` on its own line, not
      # in an argument, so neither is visible in the process list.
      - name: Import the signing certificate
        env:
          P12_BASE64: ${{ secrets.CLAW_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.CLAW_DIST_P12_PASSWORD }}
          DEV_P12_BASE64: ${{ secrets.CLAW_DEV_P12_BASE64 }}
          DEV_P12_PASSWORD: ${{ secrets.CLAW_DEV_P12_PASSWORD }}
        run: |
          set -eo pipefail
          if [ -z "$P12_BASE64" ] || [ -z "$P12_PASSWORD" ]; then
            echo "::error::CLAW_DIST_P12_BASE64 or CLAW_DIST_P12_PASSWORD is not set. The Apple Distribution certificate and its password are what sign the build; export the cert from Xcode as a .p12 and set both as repository secrets."
            exit 1
          fi
          # Both identities, because this job signs twice with two different ones:
          # the archive through automatic signing (development), the export with
          # distribution. Missing either is a stopped release rather than a
          # degraded one, so this says which name is empty in seconds.
          if [ -z "$DEV_P12_BASE64" ] || [ -z "$DEV_P12_PASSWORD" ]; then
            echo "::error::CLAW_DEV_P12_BASE64 or CLAW_DEV_P12_PASSWORD is not set. The archive is built with automatic signing, which needs the Apple Development identity in the keychain; without it Xcode asks Apple for a certificate and the account's cap stops the run. Export the Apple Development certificate from Xcode as a .p12 and set both."
            exit 1
          fi

          keychain="$RUNNER_TEMP/claw-signing.keychain-db"
          # A random, run-scoped keychain password: it only has to unlock this
          # keychain for the length of the job, and it is generated here rather
          # than kept anywhere.
          keychain_password="$(openssl rand -base64 24)"
          p12="$RUNNER_TEMP/dist-cert.p12"

          printf '%s' "$P12_BASE64" | base64 --decode > "$p12"

          security create-keychain -p "$keychain_password" "$keychain"
          # Off the auto-lock timeout, so the keychain does not relock partway
          # through a build that runs longer than the default.
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          # The password reaches security on stdin, never as an argument.
          security import "$p12" -k "$keychain" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/xcodebuild -f pkcs12

          # The Apple Development identity, into the same keychain and before the
          # partition list below, so it is authorised with the other one. This is
          # the half that was missing on 2026-09-16: the archive runs with
          # automatic signing, automatic signing wanted a development identity,
          # and the only identity imported here was the distribution one, which
          # cannot sign an archive. Xcode then asked Apple to supply a development
          # certificate, the account was already at its certificate cap, and the
          # run stopped with "Choose a certificate to revoke" and "No profiles for
          # com.azuretek.claw-mobile were found". With a development identity it
          # can reuse, nothing is minted and nothing accumulates, which is the
          # same argument that put the distribution identity here in the first
          # place.
          dev_p12="$RUNNER_TEMP/dev-cert.p12"
          printf '%s' "$DEV_P12_BASE64" | base64 --decode > "$dev_p12"
          security import "$dev_p12" -k "$keychain" -P "$DEV_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/xcodebuild -f pkcs12
          rm -f "$dev_p12"

          # Let codesign and xcodebuild use the imported key without the
          # interactive prompt that would otherwise hang a headless runner.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null

          # Put this keychain first in the search list, keeping the login and
          # system keychains after it, so the toolchain finds the identity
          # without losing the rest.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | sed 's/"//g')

          identities="$(security find-identity -v -p codesigning "$keychain")"
          echo "$identities"
          if ! printf '%s' "$identities" | grep -q 'Apple Distribution'; then
            echo "::error::the imported certificate is not an Apple Distribution identity, so it cannot sign a TestFlight build. Export the Apple Distribution certificate (not Apple Development or Developer ID) from Xcode and update the secret."
            exit 1
          fi
          if ! printf '%s' "$identities" | grep -q 'Apple Development'; then
            echo "::error::the imported certificate is not an Apple Development identity, so the archive has nothing of its own kind to sign with and Xcode will try to create one until the account's certificate cap stops the run. Export the Apple Development certificate from Xcode and update the secret."
            exit 1
          fi
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          rm -f "$p12"

      # Everything that must be true before an archive is worth building, and
      # every one of these fails in seconds what would otherwise fail minutes
      # later inside toolchain output: the app record (which no API can create),
      # the team id (which project.yml deliberately does not carry), and whether
      # this commit's build is already up, which Apple treats as a duplicate
      # rather than a replacement.
      - name: Check the account and the version
        id: preflight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          MARKETING_VERSION: ${{ needs.version.outputs.marketing }}
          BUILD_NUMBER: ${{ needs.version.outputs.build-number }}
        run: python3 scripts/asc.py preflight

      # Signing uses the Apple Distribution identity imported above, with
      # `-allowProvisioningUpdates` left on so Apple still supplies the one thing
      # the API cannot create for us, the App Store provisioning profile, which
      # it generates against the certificate already in the keychain rather than
      # minting a new certificate. That is the whole point of importing a stable
      # identity: with one present, nothing is minted and nothing accumulates,
      # where before every archive left a throwaway certificate behind until the
      # account hit Apple's cap.
      #
      # It deliberately does not fall back to a development or ad-hoc build,
      # because the only thing an unsigned archive could produce is an upload
      # Apple will reject.
      #
      # The three version overrides are the whole of the stamping. project.yml
      # keeps a value for each so a local build still reports something, and CI
      # supplies the real ones here rather than having a second copy of them
      # written into the project spec. CLAW_BUILD_VERSION is the full identity
      # (`X.Y.Z-dev.<count>.<sha>`) that the bundle cannot carry as its version
      # and that the app's own update check needs.
      #
      # This archive is the ONE build of the shipped artifact. The three steps
      # after it read it rather than make it: verify inspects it, the export
      # re-signs and uploads it, and the arrival check asks Apple about it.
      - name: Archive
        if: steps.preflight.outputs.already-uploaded != 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          MARKETING_VERSION: ${{ needs.version.outputs.marketing }}
          BUILD_NUMBER: ${{ needs.version.outputs.build-number }}
          BUILD_VERSION: ${{ needs.version.outputs.version }}
          TEAM_ID: ${{ steps.preflight.outputs.team-id }}
        run: |
          set -eo pipefail
          archive="$RUNNER_TEMP/Claw.xcarchive"
          echo "ARCHIVE_PATH=$archive" >> "$GITHUB_ENV"

          xcodebuild archive \
            -project Claw.xcodeproj \
            -scheme Claw \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CLAW_BUILD_VERSION="$BUILD_VERSION"

          if [ ! -d "$archive" ]; then
            echo "::error::xcodebuild reported success but no archive exists at $archive"
            exit 1
          fi
          echo "archived to $archive"

      # The archive is read back rather than trusted.
      #
      # The versions, because Apple rejects an upload whose bundle short version
      # is not exactly three integers or whose build number is not greater than
      # the last one, and the rejection arrives after the upload has been paid
      # for. The values in the built bundle are the only witness that the
      # overrides reached the plist at all, and a build setting that silently
      # did not apply looks exactly like one that did.
      #
      # The signing identity, as proof that something Apple issued signed it and
      # as a record of which identity that was. An archive built with automatic
      # signing carries a DEVELOPMENT identity, and that is the normal shape
      # rather than a fault: the App Store export is the step that re-signs the
      # bundle with an Apple Distribution certificate and an App Store profile,
      # and it is that step which either produces a distribution build or fails.
      # Requiring distribution signing here would reject every ordinary archive.
      # What this does refuse is an archive signed by nothing, or by an ad-hoc
      # identity, which is the difference between a misconfigured run and a
      # normal one.
      - name: Verify the archive
        if: steps.preflight.outputs.already-uploaded != 'true'
        env:
          MARKETING_VERSION: ${{ needs.version.outputs.marketing }}
          BUILD_NUMBER: ${{ needs.version.outputs.build-number }}
          BUILD_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eo pipefail
          app="$ARCHIVE_PATH/Products/Applications/Claw.app"
          if [ ! -d "$app" ]; then
            echo "::error::the archive has no app in it at $app"
            find "$ARCHIVE_PATH/Products" -maxdepth 3 || true
            exit 1
          fi

          read_key() {
            plutil -extract "$1" raw -o - "$app/Info.plist"
          }

          short="$(read_key CFBundleShortVersionString)"
          bundle="$(read_key CFBundleVersion)"
          identity="$(read_key ClawBuildVersion)"
          echo "CFBundleShortVersionString: $short"
          echo "CFBundleVersion:            $bundle"
          echo "ClawBuildVersion:           $identity"

          failed=0
          [ "$short" = "$MARKETING_VERSION" ] || { echo "::error::bundle short version is '$short', expected '$MARKETING_VERSION'"; failed=1; }
          [ "$bundle" = "$BUILD_NUMBER" ] || { echo "::error::bundle version is '$bundle', expected '$BUILD_NUMBER'"; failed=1; }
          [ "$identity" = "$BUILD_VERSION" ] || { echo "::error::the app's own build identity is '$identity', expected '$BUILD_VERSION'"; failed=1; }
          if ! printf '%s' "$short" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$short' is not three dot separated integers, which App Store Connect requires"
            failed=1
          fi
          if ! printf '%s' "$bundle" | grep -Eq '^[0-9]+$'; then
            echo "::error::'$bundle' is not numeric, which App Store Connect requires"
            failed=1
          fi

          # The app icon, which is what App Store Connect rejected when it was
          # missing (ITMS-90713 for the key, ITMS-90022 for the 120x120
          # rendition). Both come from one cause: an AppIcon set with no image
          # in it, which builds, signs, exports and uploads without a single
          # warning, and whose only witness is the bundle that arrives at Apple.
          # So it is asserted here, on the archive, where the failure costs
          # seconds instead of an upload round trip.
          #
          # Both halves are checked, because either one alone can be true of a
          # bundle Apple will still reject: the plist has to name an icon, and
          # the compiled catalog has to actually contain an icon of that name.
          icon_name="$(read_key CFBundleIconName 2>/dev/null || true)"
          if [ -z "$icon_name" ]; then
            # Xcode writes this key under CFBundleIcons rather than at the top
            # level; Claw/Info.plist declares it as well, so either location is
            # a pass and the name is all this step cares about.
            icon_name="$(plutil -extract CFBundleIcons.CFBundlePrimaryIcon.CFBundleIconName raw -o - "$app/Info.plist" 2>/dev/null || true)"
          fi
          echo "CFBundleIconName:           ${icon_name:-<absent>}"
          if [ -z "$icon_name" ]; then
            echo "::error::the archive carries no CFBundleIconName, so App Store Connect rejects the upload (ITMS-90713). Check ASSETCATALOG_COMPILER_APPICON_NAME in project.yml and the AppIcon set in Claw/Assets.xcassets."
            failed=1
          elif [ ! -f "$app/Assets.car" ]; then
            echo "::error::the archive has no Assets.car, so nothing was compiled into the asset catalog and the bundle has no app icon at all"
            failed=1
          else
            # assetutil prints the catalog's renditions as JSON, one object per
            # image. The app icon is the entry named after the icon set whose
            # type is "Icon Image".
            icon_names="$(xcrun --sdk iphoneos assetutil --info "$app/Assets.car" 2>/dev/null | python3 -c 'import json,sys;raw=sys.stdin.read();i=raw.find("[");print("\n".join(str(e.get("Name","")) for e in (json.loads(raw[i:]) if i>=0 else []) if isinstance(e,dict) and e.get("AssetType")=="Icon Image"))')"
            if printf '%s\n' "$icon_names" | /usr/bin/grep -qx "$icon_name"; then
              echo "the compiled catalog carries an app icon named $icon_name"
            else
              echo "::error::Assets.car has no icon named '$icon_name' (it has: ${icon_names:-none}), so the icon set is empty or was not compiled in. App Store Connect rejects that with ITMS-90022."
              failed=1
            fi
          fi

          [ "$failed" = 0 ] || exit 1

          authority="$(codesign -dv --verbose=2 "$app" 2>&1 | sed -n 's/^Authority=//p' | head -1)"
          case "$authority" in
            "Apple Development:"*|"Apple Distribution:"*|iPhone\ Developer:*|iPhone\ Distribution:*)
              echo "archive signed by $authority" ;;
            *)
              echo "::error::the archive is signed with '${authority:-no identity}', which is neither an Apple development nor a distribution identity, so nothing here was signed by the account. Nothing was uploaded."
              exit 1 ;;
          esac

      # The export options are built with plutil rather than written as XML, so
      # the file cannot be malformed by indentation and each value carries its
      # own type: `manageAppVersionAndBuildNumber` being a real boolean is the
      # difference between Xcode honouring it and Xcode ignoring it.
      - name: Write the export options
        if: steps.preflight.outputs.already-uploaded != 'true'
        env:
          TEAM_ID: ${{ steps.preflight.outputs.team-id }}
          TAGGED: ${{ needs.version.outputs.tagged }}
        run: |
          set -eo pipefail
          options="$RUNNER_TEMP/ExportOptions.plist"
          echo "EXPORT_OPTIONS=$options" >> "$GITHUB_ENV"

          plutil -create xml1 "$options"
          # `app-store-connect` is the method Xcode 15.3 and newer take; the
          # older `app-store` still resolves but is deprecated, and this
          # toolchain is Xcode 26 or newer.
          plutil -insert method -string app-store-connect "$options"
          # The upload, not an export: this hands the bundle to App Store
          # Connect through the same service Xcode itself uses.
          plutil -insert destination -string upload "$options"
          plutil -insert teamID -string "$TEAM_ID" "$options"
          plutil -insert signingStyle -string automatic "$options"
          # Off, and it defaults on: on means Xcode may substitute a version of
          # its own for the one the archive was stamped with, which would make
          # the two disagree after the check above has already passed.
          plutil -insert manageAppVersionAndBuildNumber -bool NO "$options"

          # A dev build is internal-testing-only so it cannot be handed to
          # external testers by accident; a tag build leaves that off, which is
          # the difference between the two kinds of run.
          if [ "$TAGGED" != "true" ]; then
            plutil -insert testFlightInternalTestingOnly -bool YES "$options"
          fi

          plutil -lint "$options"
          cat "$options"

      # The upload, through Xcode's own export rather than `altool`.
      #
      # `xcrun altool --upload-app` is deprecated and prints a deprecation
      # warning on every run; Apple's supported path is `xcodebuild
      # -exportArchive` with `destination: upload`, which validates the bundle,
      # applies the export options and hands it to App Store Connect through the
      # same content delivery service Xcode uses. It also takes the same
      # authentication key as the archive, so the account is named once.
      #
      # It reads the archive the Archive step made, with the export options
      # above, and this is the only build step after the archive: nothing is
      # rebuilt between the archive and Apple.
      #
      # Success here means App Store Connect accepted the bytes, which is NOT
      # the same as the build existing: the next step is what checks that.
      - name: Export and upload to TestFlight
        if: steps.preflight.outputs.already-uploaded != 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -eo pipefail
          export_dir="$RUNNER_TEMP/export"

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$export_dir" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

          echo "export and upload finished"

          # The artifact the export produced, read back, because the upload's
          # exit code does not say what was uploaded. Xcode writes the .ipa as
          # part of an upload, and when it does, this is the only copy of the
          # exact bundle that went to Apple: the versions Apple will read, and
          # the distribution signature the export is supposed to have applied.
          # An unsigned or development-signed .ipa here means the export did not
          # do its job, and the build has to be treated as not shipped.
          ipa="$(find "$export_dir" -maxdepth 2 -name '*.ipa' -print -quit || true)"
          if [ -z "$ipa" ]; then
            echo "no .ipa was written to $export_dir, so there is nothing on disk to read; the arrival check below is what proves the build"
            find "$export_dir" -maxdepth 3 -print || true
            exit 0
          fi

          echo "exported $ipa"
          rm -rf "$RUNNER_TEMP/ipa"
          unzip -q -o "$ipa" -d "$RUNNER_TEMP/ipa"
          uploaded_app="$RUNNER_TEMP/ipa/Payload/Claw.app"
          if [ ! -d "$uploaded_app" ]; then
            echo "::error::$ipa has no Payload/Claw.app in it"
            exit 1
          fi

          echo "uploaded CFBundleShortVersionString: $(plutil -extract CFBundleShortVersionString raw -o - "$uploaded_app/Info.plist")"
          echo "uploaded CFBundleVersion: $(plutil -extract CFBundleVersion raw -o - "$uploaded_app/Info.plist")"
          uploaded_authority="$(codesign -dv --verbose=2 "$uploaded_app" 2>&1 | sed -n 's/^Authority=//p' | head -1)"
          case "$uploaded_authority" in
            "Apple Distribution:"*|iPhone\ Distribution:*)
              echo "uploaded build signed by $uploaded_authority" ;;
            *)
              echo "::error::the exported build is signed with '${uploaded_authority:-no identity}', not an Apple Distribution certificate, so what reached Apple is not a distribution build. Treat this build as NOT shipped and check the signing setup in App Store Connect."
              exit 1 ;;
          esac

      # Why an export failed is written to a distribution log and not to the
      # failure itself. A bundle id that does not exist, a certificate Apple will
      # not issue and a key that lacks a permission all produce the same two
      # sentences, "Cloud signing permission error" and "No profiles for ...
      # were found", neither of which names a cause, and each of the three has a
      # different fix. Apple's own answer, with its status and its wording, is in
      # the log, and the runner is torn down with it: without this step the one
      # useful line is discarded and the failure reads as a mystery. Measured on
      # 2026-09-15, where it was the difference between "a permission error" and
      # "this account has not been granted cloud-managed distribution
      # certificates, and an Account Holder or Admin has to grant it".
      - name: Show Xcode's export log
        if: failure()
        run: |
          set -eo pipefail
          found=0
          for log in "${TMPDIR:-/tmp}"/Claw_*.xcdistributionlogs; do
            [ -d "$log" ] || continue
            found=1
            echo "== $log"
            find "$log" -type f -print | while IFS= read -r file; do
              echo "-- $file"
              cat "$file" || true
              echo
            done
          done
          [ "$found" = 1 ] || echo "no distribution log was written, so the failure was not in the export"

      # The gate that holds the release until the build is INSTALLABLE, not just
      # uploaded. The upload command's exit code says Apple's delivery service
      # took the bytes; this asks the API for the build record, prints each
      # processing state it moves through, and fails unless the build reaches
      # VALID. That is the point: a GitHub Release (which the in-app update feed
      # reads) publishes only once every artifact on it can be downloaded, and
      # TestFlight's Processing gate is the one artifact that is uploaded but not
      # yet installable. Publishing on mere arrival is what let the "upgrade
      # available" banner point users at a build still in Processing. Bounded by
      # WAIT_SECONDS, so a stuck build fails the run clearly rather than hanging
      # or publishing something no one can install; raised from 15 to 45 minutes
      # because Apple's processing routinely runs past 15.
      - name: Wait until the build is installable
        if: steps.preflight.outputs.already-uploaded != 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_ID: ${{ steps.preflight.outputs.app-id }}
          MARKETING_VERSION: ${{ needs.version.outputs.marketing }}
          BUILD_NUMBER: ${{ needs.version.outputs.build-number }}
          WAIT_SECONDS: "2700"
        run: python3 scripts/asc.py wait

      # What happened when this commit was built before, which is not a failure:
      # Apple accepts one build per version and build number, so a re-run of a
      # commit that is already up has nothing to upload, and pushing a
      # different app for the same version would be the only way to make it
      # meaningful. Said out loud rather than silently skipped.
      - name: Nothing to upload
        if: steps.preflight.outputs.already-uploaded == 'true'
        run: |
          echo "::notice::this commit's build (${{ needs.version.outputs.marketing }} / ${{ needs.version.outputs.build-number }}) is already in App Store Connect, so there is nothing to upload. Land a commit to make a new build number."

      # The key is a private key sitting in a temp directory, so it goes even
      # when everything above failed, and the removal is checked rather than
      # assumed: `rm -f` reports success for a file that was never there.
      - name: Remove the App Store Connect key
        if: always()
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          rm -f "$key"
          if [ -e "$key" ]; then
            echo "::error::the App Store Connect key is still at $key"
            exit 1
          fi
          echo "removed $key"
