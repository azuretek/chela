name: release-please

# ★ The release driver (issue #167). release-please watches `main`, keeps ONE
# pull request open that carries the next version bump and its CHANGELOG entry
# together, and tags `vX.Y.Z` when that pull request merges. It replaces
# release-it and the notes step release.yml used to carry.
#
# ★ Why this workflow starts the build itself. The tag is created through the
# GitHub API with GITHUB_TOKEN, and GitHub raises no workflow event for anything
# pushed with that token, so release.yml's `push: tags` trigger would never fire
# for it. `workflow_dispatch` IS exempt from that restriction, so this workflow
# starts `release.yml` on the new tag with `gh workflow run --ref <tag>`. No
# personal access token is needed for the release path to run.
#
# release.yml is unchanged in what it does once it starts: it reads the tag,
# builds every platform, attaches the assets to the draft release-please opened,
# and publishes only when the whole asset set is present.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # A tag and a draft release carrying the changelog exist only when
      # release-please just merged a release pull request. Start the desktop
      # release for that tag; nothing else in this workflow does.
      - name: Start the release build for the new tag
        if: ${{ steps.release.outputs.tag_name != '' && steps.release.outputs.tag_name != null }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -eo pipefail
          echo "release-please created ${TAG}; starting chela-desktop release for it"
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
